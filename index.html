/* Apenas campos no claro: as divisórias continuam a usar --border. */
:root[data-theme="light"] :is(input:not([type="radio"]):not([type="checkbox"]):not([type="range"]):not([type="file"]), select, textarea):not(:focus) { border-color: var(--field-border); }
html { background: var(--bg); }
.card { box-shadow: var(--shadow); }
.theme-choice { border: 0; padding: 8px 20px; }
.theme-choice legend { color: var(--text); font-weight: 700; }
.theme-choice label { display: flex; align-items: center; gap: 12px; min-height: 44px; cursor: pointer; }
.theme-choice input { width: 20px; height: 20px; accent-color: var(--primary); }
*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior-y: none;
}

/* ── TIMER BANNER ─────────────────────────────────── */
:root { --banner-h: calc(76px + env(safe-area-inset-top, 0px)); }
body.show-header-timer:has(#timerBanner.show):not(.guided) { padding-top: var(--banner-h); }
body.show-header-timer:has(#timerBanner.show):not(.guided) #hdr { top: var(--banner-h); }
#timerBanner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--success-bg);
  border-bottom: 2px solid var(--green);
  transform: translateY(-110%);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
#timerBanner.show { transform: translateY(0); }
#timerBanner.warn { background: var(--warn-bg); border-color: var(--accent); }

.t-left  { display: flex; align-items: center; gap: 14px; }
.t-ring  {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.t-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.t-ring-bg { stroke: var(--ov-1); }
.t-ring-fill {
  stroke: var(--green);
  stroke-dasharray: 138.2; /* 2π×22 */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
#timerBanner.warn .t-ring-fill { stroke: var(--accent); }
.t-num {
  position: relative; z-index: 1;
  font-size: 13px; font-weight: 800; color: var(--success);
}
#timerBanner.warn .t-num { color: var(--accent); }
.t-info { line-height: 1.2; }
.t-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.t-big   { font-size: 28px; font-weight: 800; color: var(--success); }
#timerBanner.warn .t-big { color: var(--accent); }
.t-right { display: flex; gap: 6px; flex-shrink: 0; }
.t-btn {
  padding: 8px 12px; border-radius: var(--r-sm);
  background: var(--ov-2); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.t-btn:hover { background: var(--ov-3); }
.t-btn.plus { color: var(--success); border-color: var(--success-border); }
#timerBanner.warn .t-btn.plus { color: var(--accent); border-color: var(--danger-border); }

/* ── HEADER ───────────────────────────────────────── */
#hdr {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px 0;
}
.hdr-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 10px;
}
.hdr-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.hdr-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }
.hdr-timer-btn {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  background: var(--danger-a01); border: 1px solid var(--danger-border);
  color: var(--accent); padding: 9px 14px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s;
}
.hdr-timer-btn:hover { background: var(--danger-a02); }
.hdr-timer-row { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.hdr-timer-adj {
  width: 30px; height: 36px; border-radius: var(--r-sm);
  background: var(--danger-a007); border: 1px solid var(--danger-a02);
  color: var(--accent); font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center;
}
.hdr-timer-adj:hover { background: var(--danger-a018); }
.prog-bar  { height: 2px; background: var(--border); margin: 0 -20px; }
.prog-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.5s ease;
}

/* ── NAVEGAÇÃO INFERIOR ───────────────────────────── */
#bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 250; background: var(--card); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
body.kb #bnav { display: none; }
.nav-row { display: flex; align-items: stretch; max-width: 640px; margin: 0 auto; }
.nb { flex: 1; min-width: 0; min-height: 58px; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.nb-i { font-size: 20px; line-height: 1; position: relative; }
.nb-i[data-badge]:not([data-badge=""])::after { content: attr(data-badge); position: absolute; top: -5px; left: 60%; background: var(--success-fill); color: var(--on-success); font-size: 9px; font-weight: 900; padding: 2px 5px; border-radius: 6px; line-height: 1; }
.nb-l { font-size: 11px; font-weight: 700; }
.nb.active { color: var(--accent); }
.nb:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; }
.nav-livewrap { display: flex; align-items: stretch; max-width: 640px; margin: 0 auto; border-bottom: 1px solid var(--border); }
.nav-livewrap[hidden], .nav-live[hidden], .nav-drop[hidden] { display: none; }
.nav-live .nl-t { flex: 1; min-width: 0; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-live > span:last-child { flex: none; margin-left: 10px; white-space: nowrap; }
.nav-live { flex: 1; min-width: 0; min-height: 44px; background: var(--danger-a01); border: 0; color: var(--text); font-family: inherit; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; cursor: pointer; }
.nav-drop { flex: none; width: 44px; min-height: 44px; border: 0; background: none; color: var(--muted); font-size: 16px; cursor: pointer; }
#content { padding-bottom: calc(110px + env(safe-area-inset-bottom)) !important; }

/* ── CONTENT GRID ─────────────────────────────────── */
#content {
  padding: 16px; max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--sp-4);
}
@media (min-width: 640px)  { #content { grid-template-columns: repeat(2, 1fr); padding: 20px; } }
@media (min-width: 1024px) { #content { grid-template-columns: repeat(3, 1fr); } }

/* ── AGENDA (tira da semana, avisos, descanso) ────── */
.full { grid-column: 1/-1; }
.week-strip {
  display: grid; grid-template-columns: repeat(7, minmax(44px, 1fr)); gap: 4px;
  overflow-x: auto;
  margin-bottom: 2px;
}
.wk-chip {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  min-width: 44px; min-height: 44px; padding: 8px 2px; cursor: pointer;
  background: var(--card, var(--ov-4));
  border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--muted); font-size: 11px; font-weight: 700;
  transition: border-color 0.2s, color 0.2s, background 0.2s;
}
.wk-chip .wk-i { font-size: 13px; line-height: 1; }
.wk-chip.s-done  { color: var(--success); border-color: var(--success-a04); background: var(--success-a008); }
.wk-chip.s-partial { color: var(--warn); border-color: var(--warn-a04); }
.wk-chip.s-swapped { opacity: 0.75; }
.wk-chip.s-rest { color: var(--rest-text); background: var(--rest-bg); border-color: var(--rest-border); }
.wk-chip.s-rest.current { color: var(--rest-current); border-color: var(--rest-current); }
.wk-chip.s-rest.today { box-shadow: inset 0 -2px 0 var(--rest-current); }
.wk-chip.current { border-color: var(--accent); color: var(--accent); }
.wk-chip.today   { box-shadow: inset 0 -2px 0 var(--accent); }
.sched-note {
  padding: 10px 12px; border-radius: var(--r-sm);
  background: var(--success-a008); border: 1px solid var(--success-a025);
  font-size: 13px; color: var(--text);
}
.sched-note.warn { background: var(--warn-a008); border-color: var(--warn-border); }
.rest-card {
  text-align: center; padding: 34px 18px;
  border: 1px solid var(--border); border-radius: var(--r);
  background: var(--card, var(--ov-4));
  display: flex; flex-direction: column; align-items: center; gap: 8px;
}
.rest-emoji { font-size: 46px; }
.rest-title { font-size: 20px; font-weight: 800; }
.rest-sub { font-size: 13px; color: var(--muted); max-width: 420px; }
.week-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.wk-row, .ev-link {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 14px; cursor: pointer;
  border: 1px solid var(--border); border-radius: var(--r-sm);
  background: var(--card, var(--ov-4));
  font: inherit; color: inherit; text-align: left; width: 100%;
}
.wk-row:hover, .ev-link:hover { border-color: var(--accent); }
.wk-row-day { font-size: 15px; font-weight: 700; }
.wk-row-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.wk-row-st { font-size: 11px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.wk-row.s-done .wk-row-st { color: var(--success); }
.wk-row.s-rest, .wk-row.s-rest * { color: var(--muted); }
.wk-row.s-rest .wk-today { background: transparent; }
.wk-today {
  font-size: 11px; font-weight: 900; text-transform: uppercase;
  background: var(--accent); color: var(--on-accent); padding: 2px 6px; border-radius: 4px;
  vertical-align: middle;
}
/* ── TREINO PERSONALIZADO ─────────────────────────── */
.cu-entry { width: 100%; margin-top: 8px; }
.sched-note.cu-entry { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cu-title { font-size: 13px; font-weight: 700; margin: 14px 0 8px; }
.cu-title small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
.cu-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cu-chip small { display: block; font-size: 10px; font-weight: 600; opacity: 0.75; }
.cu-chip.recent:not(.on) { border-color: var(--warn-a05); }
.cu-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 6px; }
.cu-actions .start-wo:disabled { opacity: 0.4; }
.cu-note, .cu-past { font-size: 12px; color: var(--muted); margin-top: 4px; }
.cu-row {
  display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: var(--r-sm); background: var(--card);
}
.cu-n { font-size: 12px; font-weight: 800; color: var(--muted); width: 16px; text-align: center; }
.cu-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cu-info b { font-size: 14px; overflow-wrap: anywhere; }
.cu-info small { font-size: 12px; color: var(--muted); }
.day-foot { grid-column: 1/-1; display: flex; justify-content: center; padding: 4px 0 8px; }
.start-wo.wide { padding: 12px 28px; font-size: 14px; }
.ed-check, .ed-ss {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; color: var(--muted); padding: 4px 0 8px;
}

/* ── DAY HEADER ───────────────────────────────────── */
.day-hdr {
  grid-column: 1/-1;
  display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding-bottom: 4px; border-bottom: 1px solid var(--border);
}
.day-hdr-name { font-size: 22px; font-weight: 800; }
.day-hdr-sub  { font-size: 13px; color: var(--muted); margin-top: 2px; }
.reset-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); padding: 7px 12px; border-radius: var(--r-sm);
  font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: border-color 0.2s, color 0.2s;
}
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── EXERCISE CARD ────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  transition: border-color 0.3s, background 0.3s;
  display: flex; flex-direction: column;
}
.card.done {
  border-color: var(--success-a025);
  background: color-mix(in srgb, var(--card) 92%, var(--success-mix));
}

/* image section */
.img-wrap {
  position: relative; overflow: hidden;
  background: var(--placeholder);
  aspect-ratio: 4/3;
}
.card.done .img-wrap { opacity: 0.55; }
.slides {
  display: flex; height: 100%; width: 100%;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.slides.drag { transition: none; }
.slide {
  flex: 0 0 100%; height: 100%;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.slide img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  user-select: none; pointer-events: none;
}
.no-img {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, var(--placeholder-high) 0%, var(--placeholder) 100%);
  color: var(--muted);
}
.no-img span:first-child { font-size: 44px; opacity: 0.5; }
.no-img span:last-child  { font-size: 13px; text-align: center; padding: 0 12px; }
.slide-prev, .slide-next {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--scrim-29); backdrop-filter: blur(4px);
  border: none; color: var(--on-primary); font-size: 18px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; z-index: 10;
}
.slide-prev { left: 8px; }
.slide-next { right: 8px; }
.slide-prev:hover, .slide-next:hover { background: rgba(0,0,0,0.8); }
.dots {
  position: absolute; bottom: 8px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 5px; pointer-events: none;
}
.dot {
  width: 6px; height: 6px; border-radius: 3px; border: 0; padding: 0;
  background: rgba(255,255,255,0.35); transition: all 0.2s; pointer-events: auto; cursor: pointer;
}
.dot.on { width: 18px; background: #fff; }

/* card body */
.card-body { padding: 14px 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

.card-title-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.card-title { font-size: 16px; font-weight: 700; line-height: 1.25; }
.done-pill {
  display: none; flex-shrink: 0;
  background: var(--success-fill); color: var(--on-success);
  font-size: 10px; font-weight: 800; padding: 3px 8px;
  border-radius: 4px; margin-top: 2px;
}
.card.done .done-pill { display: block; }

.card-stats {
  display: flex; gap: 20px;
}
.stat {
  display: flex; flex-direction: column; gap: 1px;
}
.stat-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.stat-val   { font-size: 20px; font-weight: 800; line-height: 1; }

/* set circles */
.sets-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.sets-row   { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.set-btn {
  width: 46px; height: 46px; border-radius: 50%;
  border: 2px solid var(--ov-6);
  background: var(--ov-7);
  color: var(--muted); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center;
}
.set-btn:active { transform: scale(0.88); }
.set-btn.on {
  background: var(--success-fill); border-color: var(--success); color: var(--on-success);
}

/* tip */
.tip {
  background: var(--ov-4);
  border-left: 3px solid var(--accent2);
  padding: 9px 11px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 12px; color: var(--muted); line-height: 1.55;
}

/* alternative exercise */
.card-alt {
  font-size: 12px; color: var(--muted); line-height: 1.5;
  padding: 8px 11px; border-radius: var(--r-sm);
  background: var(--info-bg); border: 1px solid var(--info-border);
}
.card-alt strong { color: var(--text-soft); font-weight: 600; }

/* action buttons */
.card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; }
.act-btn {
  flex: 1; padding: 11px 8px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 700; cursor: pointer;
  border: 1px solid; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.act-timer {
  background: var(--danger-a008); border-color: var(--danger-a025); color: var(--accent);
}
.act-timer:hover { background: var(--danger-a016); }
.act-done {
  background: var(--success-a008); border-color: var(--success-a025); color: var(--success);
}
.act-done:hover  { background: var(--success-a016); }
.card.done .act-done { background: var(--success-a02); }
.act-swap {
  flex: 0 0 auto; padding: 11px 12px;
  background: transparent; border-color: var(--border); color: var(--muted);
}
.act-swap:hover { border-color: var(--accent); color: var(--accent); }
.card-swap {
  font-size: 12px; color: var(--warn);
  background: var(--warn-a008); border: 1px solid var(--warn-a025);
  border-radius: var(--r-sm); padding: 8px 10px;
}
.cat-swap { display: flex; flex-direction: column; gap: 6px; padding-bottom: 4px; }
.cat-swap-t { font-size: 13px; color: var(--text); }
.cat-swap-alt { font-size: 12px; color: var(--muted); }

/* ── ANIMATIONS ───────────────────────────────────── */
@keyframes pop { 0%{transform:scale(0.85)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
.set-btn.pop { animation: pop 0.22s ease; }

/* ── LOAD / PROGRESSÃO ────────────────────────────── */
/* Cartao Dia: registo essencial e detalhes em Mais. */
.card .card-body { gap: 14px; padding: 16px; }
/* Bloco 5: nome à esquerda, «séries × reps» à direita (a pílula «Feito» por baixo); nomes longos quebram na sua coluna */
.card .card-title-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 4px 12px; }
.card .card-title { font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.card .card-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 50cqw; }
.card .card-stats { display: flex; align-items: baseline; gap: 5px; margin: 0; padding-top: 2px; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; color: var(--muted); }
.card .card-stats .st-vis { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.card .card-stats b { font-size: 16px; font-weight: 800; color: var(--text); }
.card .card-stats .st-x { font-weight: 600; }
.card .done-pill { margin-top: 0; }
.card .sets-label { display: none; }
/* séries: colunas iguais, bolinhas centradas e repartidas pela largura (pendente · feita · atual) */
.card .sets-row { display: grid; grid-template-columns: repeat(var(--c, 4), minmax(0, 1fr)); gap: 10px 8px; justify-items: center; margin-top: 0; width: 100%; max-width: 360px; }
.card .card-body { container-type: inline-size; }
@container (max-width: 303px) { .card .sets-row[data-n="6"] { --c: 3 !important; } }
.card .set-btn { width: 46px; height: 46px; }
.card .set-btn.next { border-color: var(--accent); border-width: 3px; color: var(--text); font-weight: 800; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.card .load-row { gap: 8px; }
.card .load-in { flex: 1; min-width: 0; }
.card .card-actions { padding-top: 0; }
.card .act-timer { flex: 0 0 auto; padding: 0 16px; }
.card-tools { display: flex; gap: 8px; }
.card-tools > button { flex: 1; }
.card-details { display: flex; flex-direction: column; gap: 10px; }
.card-details[hidden] { display: none; }
.card .load-in, .card .load-save, .card .act-btn, .card-more { min-height: 44px; }
.card .load-save { min-width: 44px; background: var(--success-fill); border-color: var(--success); color: var(--on-success); }
.card .act-done, .card .act-timer { background: transparent; border-color: var(--border); color: var(--text); }
.card-more { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; border: 0; border-top: 1px solid var(--border); border-radius: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: -2px; }
.more-ic { transition: transform 0.2s; }
.card-more[aria-expanded="true"] .more-ic { transform: rotate(180deg); }
.card .load-chart-btn { width: auto; min-height: 44px; padding: 0 12px; color: var(--text); font-size: 13px; font-weight: 700; }
.card .slide-prev, .card .slide-next, .card .info-btn { width: 44px; height: 44px; background: var(--media-control-bg); color: var(--media-control-text); }
.card .dots { gap: 4px; bottom: 0; background: var(--media-control-bg); }
.card .dot, .card .dot.on { width: 44px; height: 44px; border-radius: 0; background: transparent; display: grid; place-items: center; }
.card .dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--media-control-muted); }
.card .dot.on::after { background: var(--media-control-text); }
.card .card-swap .linklike { min-height: 44px; color: inherit; }
.card button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

.load { display: flex; flex-direction: column; gap: 8px; }
.load-row { display: flex; align-items: center; gap: 6px; }
.load-in {
  flex: 1 1 0; width: 0; min-width: 0; height: 38px;
  background: var(--ov-7); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text);
  font-size: 15px; font-weight: 700; text-align: center;
  -moz-appearance: textfield;
}
.load-in::-webkit-outer-spin-button, .load-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.load-in::placeholder { color: var(--muted); font-weight: 600; }
.load-in:focus { outline: none; border-color: var(--accent); background: var(--danger-a006); }
.load-x { color: var(--muted); font-size: 13px; font-weight: 700; flex-shrink: 0; }
.load-save {
  flex-shrink: 0; height: 38px; padding: 0 12px; border-radius: var(--r-sm);
  background: var(--danger-a01); border: 1px solid var(--danger-a028);
  color: var(--danger); font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s;
}
.load-save:hover { background: var(--danger-a018); }
.load-save.ok { background: var(--success-fill); border-color: var(--success); color: var(--on-success); }
.load-chart-btn {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: var(--r-sm);
  background: var(--ov-7); border: 1px solid var(--border);
  font-size: 15px; cursor: pointer; transition: background 0.15s;
}
.load-chart-btn:hover { background: var(--ov-1); }
.lc { background: var(--ov-8); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px; }
.lc-svg { width: 100%; height: auto; display: block; overflow: visible; }
.lc-empty { font-size: 12px; color: var(--muted); line-height: 1.5; text-align: center; padding: 6px 4px; }
.lc-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.lc-meta b { color: var(--text); font-size: 14px; }
.lc-1rm { color: var(--accent2); font-weight: 700; }
.lc-range { margin-left: auto; }

/* ── HEADER GEAR ──────────────────────────────────── */
.hdr-gear {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  background: var(--ov-9); border: 1px solid var(--border);
  color: var(--text); font-size: 16px; cursor: pointer; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 2px;
}
.hdr-gear:hover { background: var(--ov-10); }

/* ── SETTINGS SHEET ───────────────────────────────── */
.sheet-bg {
  position: fixed; inset: 0; z-index: 400;
  background: var(--scrim); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 480px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
  display: flex; flex-direction: column; gap: 8px;
}
.sheet-bg.show .sheet { transform: translateY(0); }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: var(--ov-11); margin: 8px auto 6px; }
.sheet-title { margin: 0; font-size: 14px; font-weight: 700; color: var(--muted); padding: 0 4px 4px; }
.sheet-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 14px; border-radius: var(--r-sm);
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s;
  text-align: left;
}
.sheet-item:hover { background: var(--card2); }
.sheet-arrow { color: var(--muted); font-size: 18px; }
.sw { width: 42px; height: 24px; border-radius: 12px; background: var(--ov-6); position: relative; transition: background 0.2s; flex-shrink: 0; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--on-primary); transition: transform 0.2s; }
.sw.on { background: var(--green); }
.sw.on::after { transform: translateX(18px); }
.sheet-note { font-size: 12px; color: var(--muted); padding: 2px 4px; min-height: 1px; }

/* ── MAPA MUSCULAR ────────────────────────────────── */
.muscle-slide {
  flex-direction: column; gap: 6px;
  padding: 8px 10px 10px;
  background: linear-gradient(135deg, var(--placeholder-mid) 0%, var(--placeholder) 100%);
}
.muscle-svg { flex: 1; min-height: 0; width: 100%; display: block; }
.m-legend { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.m-chip {
  font-size: 10px; font-weight: 700; line-height: 1;
  padding: 3px 7px; border-radius: 999px; white-space: nowrap; font-family: inherit;
}
.m-chip.prim { background: var(--danger-a015); color: var(--accent); border: 1px solid var(--danger-a035); }
.m-chip.sec  { background: var(--secondary-a012); color: var(--accent2); border: 1px solid var(--secondary-a03); }

/* ── NUTRIÇÃO ─────────────────────────────────────── */
.nutri-wrap { grid-column: 1/-1; max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.nplan-hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.nform { display: flex; flex-direction: column; gap: 10px; }
.nrow { display: flex; gap: 10px; flex-wrap: wrap; }
.nfield { flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.nfield.full { flex-basis: 100%; }
.nfield select, .nfield input, .nfree {
  height: 40px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); font-size: 15px; font-weight: 600; padding: 0 10px; width: 100%;
}
.nfield select:focus, .nfield input:focus, .nfree:focus { outline: none; border-color: var(--accent); }
.nsec-title { font-size: 12px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.nchips { display: flex; flex-wrap: wrap; gap: 6px; }
.nchip { cursor: pointer; }
.nchip input { position: absolute; opacity: 0; pointer-events: none; }
.nchip span {
  display: inline-block; padding: 7px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--muted); transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.nchip input:checked + span { background: var(--danger-a015); border-color: var(--danger-a04); color: var(--accent); }
.nfree { height: 38px; font-size: 14px; }
.nbtn {
  margin-top: 8px; height: 48px; border-radius: var(--r-sm);
  background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none;
  color: var(--on-accent); font-size: 16px; font-weight: 800; cursor: pointer;
}
.nbtn:active { transform: scale(0.99); }
.ntargets { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.ntar { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 3px; }
.ntar-v { font-size: 24px; font-weight: 800; color: var(--accent); }
.ntar-l { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.nmacros { font-size: 13px; color: var(--muted); text-align: center; }
.nmeals { display: flex; flex-direction: column; gap: 8px; }
.nmeal { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 11px 13px; }
.nmeal.treino { border-color: var(--danger-border); background: var(--danger-a005); }
.nmeal-t { font-size: 13px; font-weight: 700; color: var(--text); }
.nmeal-i { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.nnote { font-size: 12px; color: var(--muted); line-height: 1.55; background: var(--info-bg); border: 1px solid var(--info-border); border-radius: var(--r-sm); padding: 10px 12px; }
.nnote b { color: var(--text-medium); }
.nshop { display: flex; flex-wrap: wrap; gap: 6px; }
.nshop-i { font-size: 12px; font-weight: 600; color: var(--text); background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px 10px; }
.ndisc { font-size: 11px; color: var(--muted); font-style: italic; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.m-chip { background: var(--card2); border: 1px solid var(--border); color: var(--muted); }
#mchips .m-chip { cursor: pointer; }
.linklike { background: none; border: none; color: var(--accent); font-weight: 700; cursor: pointer; text-decoration: underline; padding: 0; font: inherit; }
.lc-when { color: var(--muted); opacity: 0.85; }

/* ── DIÁRIO DE INGESTÃO ───────────────────────────── */
.iprog { display: flex; flex-direction: column; gap: 5px; }
.iprog-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.iprog-row b { color: var(--text); font-size: 14px; }
.ibar { height: 8px; background: var(--ov-2); border-radius: 4px; overflow: hidden; }
.ibar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 4px; transition: width 0.4s; }
.ibar-fill.prot { background: var(--info); }
.ibar-fill.over { background: var(--accent); }
.iadd { display: flex; gap: 6px; }
.iadd .nfree { height: 40px; }
.iadd .inum { max-width: 74px; }
.iadd .load-save { height: 40px; flex-shrink: 0; }
.qfoods { display: flex; flex-wrap: wrap; gap: 6px; }
.qfood { font-size: 11px; font-weight: 600; color: var(--muted); background: var(--card2); border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px; cursor: pointer; }
.qfood:hover { color: var(--text); border-color: var(--accent); }
.ilist { display: flex; flex-direction: column; gap: 6px; }
.iitem { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 9px 11px; }
.iitem-main { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.iitem-n { font-size: 14px; font-weight: 600; }
.iitem-t { font-size: 11px; color: var(--muted); }
.iitem-r { display: flex; align-items: center; gap: 10px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
.iitem-x { width: 26px; height: 26px; border-radius: 6px; background: var(--ov-9); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
.iitem-x:hover { color: var(--accent); border-color: var(--accent); }

/* ── DEMOS (media slides) ─────────────────────────── */
.info-btn { position: absolute; top: 8px; right: 8px; z-index: 12; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; font-style: italic; font-family: Georgia, serif; color: #fff; background: rgba(0,0,0,0.55); backdrop-filter: blur(4px); border: 1px solid rgba(255,255,255,0.25); border-radius: 50%; cursor: pointer; }
.info-btn:hover { background: rgba(239,68,68,0.85); }

/* ── INFO MODAL ───────────────────────────────────── */
.info-bg { position: fixed; inset: 0; z-index: var(--z-sheet, 700); background: var(--scrim-57); backdrop-filter: blur(3px); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.2s, visibility 0s 0.2s; }
.info-bg.show { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity 0.2s; }
.info-card { position: relative; width: 100%; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); transform: translateY(12px) scale(0.98); transition: transform 0.22s cubic-bezier(0.34,1.4,0.64,1); }
.info-bg.show .info-card { transform: translateY(0) scale(1); }
.info-close { position: absolute; top: 12px; right: 12px; width: 44px; height: 44px; border-radius: 50%; background: var(--ov-12); border: 1px solid var(--border); color: var(--text); font-size: 14px; cursor: pointer; }
#infoBody { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 20px; }   /* o X fica no cartão, que não rola: nunca desaparece com o scroll */
.info-close:hover { background: var(--ov-13); }
.info-x-name { font-size: 20px; font-weight: 800; margin-bottom: 14px; padding-right: 52px; color: var(--text); }
.info-sec { margin-bottom: 16px; }
.info-h { font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.info-sec p { font-size: 14px; line-height: 1.6; color: var(--text); }
.info-sec ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.info-sec li { font-size: 14px; line-height: 1.5; color: var(--text-strong); }
.info-add { margin-top: 18px; }
.info-add .nbtn { font-size: 14px; height: 44px; }

/* progressão + volume */
.lc-next { margin-top: 8px; font-size: 13px; color: var(--accent2); font-weight: 600; }
.lc-next b { color: var(--text); }
.lc-next-s { color: var(--muted); font-weight: 400; font-size: 11px; }
.lc-prog { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.lc-prog-t { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.lc-prog-m { font-size: 12px; color: var(--muted); margin-top: 6px; }
.lc-inc { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 4px; }
.lc-inc input { width: 72px; padding: 6px 8px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font: inherit; font-weight: 700; }
.vol { display: flex; flex-direction: column; gap: 6px; }
.vol-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
.vol-l { width: 92px; flex-shrink: 0; color: var(--muted); }
.vol-bar { flex: 1; height: 9px; background: var(--ov-12); border-radius: 5px; overflow: hidden; }
.vol-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 5px; }
.vol-v { width: 26px; text-align: right; font-weight: 700; color: var(--text); }

/* day header buttons + iniciar */
.day-hdr-btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.start-wo { background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; color: var(--on-accent); font-size: 13px; font-weight: 800; padding: 8px 14px; border-radius: var(--r-sm); cursor: pointer; white-space: nowrap; }
.start-wo:active { transform: scale(0.97); }

/* TREINO GUIADO */
/* ── TREINO GUIADO: ecrã dedicado ─────────────────────
   Camadas, de baixo para cima: conteúdo < barra geral 250 < banner de descanso 300 < guiado 500 < ficha e folhas 700.
   Com o guiado aberto, a barra geral e o banner escondem-se (body.guided): nunca duas barras ao mesmo tempo, e o
   descanso mostra-se DENTRO do guiado (#woRest), não por baixo dele. */
:root { --z-nav: 250; --z-banner: 300; --z-guided: 500; --z-sheet: 700; }
body.guided #bnav, body.guided #timerBanner { display: none !important; }
.wo-bg { position: fixed; inset: 0; z-index: var(--z-guided); background: var(--bg); display: none; flex-direction: column; }
.wo-bg.show { display: flex; }
.wo-body { flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; max-width: 560px; margin: 0 auto; }
.wo-bar { flex: none; display: flex; align-items: center; gap: 8px; padding: calc(8px + env(safe-area-inset-top)) 12px 8px; border-bottom: 1px solid var(--border); }
.wo-bar button { min-width: 48px; min-height: 48px; padding: 0 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font: 700 15px/1 inherit; cursor: pointer; }
.wo-bar .wo-pause.paused { background: var(--success-fill); color: var(--on-success); border-color: var(--success); }
.wo-prog { flex: 1; min-width: 0; text-align: center; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
.wo-prog small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
.wo-scroll { --wo-media-h: clamp(170px, 40dvh, 400px); flex: 1; min-height: 0; overflow-y: auto; padding: var(--sp-4) var(--sp-4) var(--sp-2); display: flex; flex-direction: column; gap: var(--sp-4); }
.wo-scroll.resting { --wo-media-h: clamp(110px, 18dvh, 190px); }
.wo-media { flex: none; align-self: center; margin: 0; width: min(100%, var(--wo-media-h)); aspect-ratio: 1; border-radius: var(--r-lg); background: #fff; overflow: hidden; }
.wo-media.wide { width: min(100%, calc(var(--wo-media-h) * 1.5)); aspect-ratio: 3 / 2; }
.wo-img { display: block; width: 100%; height: 100%; object-fit: contain; }
/* ecrãs baixos (telemóveis pequenos, teclado aberto): o descanso e os campos têm prioridade sobre a demonstração */
@media (max-height: 800px) { .wo-scroll.resting .wo-media { display: none; } }
@media (max-height: 520px) { .wo-media { display: none; } }
.wo-title { display: flex; flex-direction: column; gap: var(--sp-2); }
.wo-name { font-size: 26px; font-weight: 800; line-height: 1.15; overflow-wrap: anywhere; }
.wo-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); flex-wrap: wrap; }
.wo-sub { font-size: 16px; color: var(--text-muted); font-weight: 700; }
.wo-dots { display: flex; gap: 10px; }
.wo-dots i { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--muted); }
.wo-dots i.on { background: var(--green); border-color: var(--success); }
.wo-hint { font-size: 14px; color: var(--accent2); font-weight: 600; }
.wo-hint b { color: var(--text); }
/* descanso: faixa própria entre a zona com scroll e o dock — nunca fica cortado nem tapado */
.wo-rest { flex: none; margin: 0 12px 8px; border-radius: var(--r); background: var(--success-bg); border: 1px solid var(--green); padding: 8px 12px; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "main btns" "bar bar" "next next"; align-items: center; gap: 6px 10px; }
.wo-rest-main { grid-area: main; min-width: 0; }
.wo-rest[hidden] { display: none; }
.wo-rest-lbl { font-size: 13px; font-weight: 700; color: var(--success-soft); letter-spacing: 0.06em; text-transform: uppercase; }
.wo-rest-num { font-size: 44px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.wo-rest.warn { background: var(--warn-bg); border-color: var(--accent2); }
.wo-rest.warn .wo-rest-num { color: var(--accent2); }
.wo-rest-bar { grid-area: bar; height: 6px; border-radius: 3px; background: var(--ov-10); overflow: hidden; }
.wo-rest-bar i { display: block; height: 100%; background: var(--green); }
.wo-rest-next { grid-area: next; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wo-rest-btns { grid-area: btns; display: flex; gap: 8px; }
.wo-rest-btns .wo-btn { min-width: 76px; min-height: 48px; }
/* o aviso de recorde/erro não tapa Sair/Pausar do guiado */
body.guided #toast { top: calc(env(safe-area-inset-top, 0px) + 76px); }
.wo-btn { min-height: 52px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; font-weight: 700; cursor: pointer; }
.wo-dock { flex: none; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; gap: 12px; }
.wo-load { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wo-field { display: flex; align-items: center; gap: 4px; min-width: 0; }
.wo-col { min-width: 0; }
.wo-lbl { display: block; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 3px; }
.wo-field .load-in { min-width: 0; flex: 1; width: 100%; height: 52px; text-align: center; font-size: 18px; font-weight: 700; }
.wo-field .load-in.bad { border-color: var(--accent); }
.wo-step { width: 48px; height: 52px; flex: none; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 22px; font-weight: 700; cursor: pointer; }
@media (max-width: 360px) { .wo-load { gap: 8px; } .wo-step { width: 44px; } }   /* mais largura para ler kg e reps em ecrãs estreitos */
.wo-main { width: 100%; min-height: 64px; border-radius: var(--r); border: 0; background: var(--success-fill); color: var(--on-success); font-size: 20px; font-weight: 800; cursor: pointer; }
.wo-main.next { background: var(--primary-solid); color: var(--on-primary); }
.wo-main.resume { background: var(--success-fill); }
.wo-links { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 8px; }
.wo-links button { min-height: 48px; border-radius: var(--r-sm); border: 1px solid var(--border); background: none; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; }
.wo-end { align-self: center; min-height: 48px; padding: 0 16px; background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: underline; cursor: pointer; }
.wo-bg button:focus-visible, #bnav button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }

/* SCANNER */
.scan-bg { position: fixed; inset: 0; z-index: 710; background: #000; display: none; align-items: center; justify-content: center; }
.scan-bg.show { display: flex; }
.scan-vid { width: 100%; height: 100%; object-fit: cover; }
.scan-frame { position: absolute; width: 72%; max-width: 320px; height: 140px; border: 3px solid rgba(255,255,255,0.85); border-radius: 14px; box-shadow: 0 0 0 4000px rgba(0,0,0,0.45); }
.scan-hint { position: absolute; top: 16%; color: #fff; font-size: 14px; font-weight: 600; text-shadow: 0 1px 3px #000; }
.scan-close { position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; font-size: 15px; font-weight: 700; padding: 12px 22px; border-radius: 999px; cursor: pointer; }
.media-slide { position: relative; background: #0d0d14; }
.media-slide img, .media-slide video { width: 100%; height: 100%; object-fit: cover; }
.media-del { position: absolute; top: 8px; left: 8px; z-index: 12; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.55); border: none; color: #fff; font-size: 14px; cursor: pointer; }
.media-del:hover { background: rgba(239,68,68,0.85); }
.demo-slide { position: relative; background: #fff; }
.demo-slide img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.demo-slide .demo-b { animation: demoFade 2.4s ease-in-out infinite; }
@keyframes demoFade { 0%, 42% { opacity: 0; } 58%, 100% { opacity: 1; } }
.demo-tag { position: absolute; top: 8px; left: 8px; z-index: 11; font-size: 10px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,0.6); border-radius: 999px; padding: 3px 8px; }
.demo-broken { background: linear-gradient(135deg, var(--placeholder-high) 0%, var(--placeholder) 100%); }
.demo-broken img { display: none; }
.demo-broken .demo-tag { display: none; }
.demo-broken::after { content: '🎬 liga-te à internet uma vez para guardar a demo'; color: var(--muted); font-size: 12px; text-align: center; padding: 0 18px; }
.ihist { background: var(--ov-8); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
.ihist-h { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: var(--text); }
.sheet-sub { font-size: 12px; font-weight: 700; color: var(--muted); padding: 8px 4px 2px; text-transform: uppercase; letter-spacing: 0.05em; }

/* CATÁLOGO (pesquisa dos 1324 exercícios) */
.cat-bg { position: fixed; inset: 0; z-index: 600; background: var(--bg); display: flex; flex-direction: column; opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.18s, visibility 0s 0.18s; }
.cat-bg.show { opacity: 1; pointer-events: auto; visibility: visible; transition: opacity 0.18s; }
.cat-hdr { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
.cat-q { flex: 1; min-width: 0; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 15px; }
.cat-q:focus { outline: none; border-color: var(--accent); }
.cat-close { width: 40px; height: 40px; flex: none; border-radius: 50%; background: var(--ov-12); border: 1px solid var(--border); color: var(--text); font-size: 15px; cursor: pointer; }
.cat-filters { padding: 8px 16px 0; }
.cat-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.cat-chips::-webkit-scrollbar { display: none; }
.cat-chip { flex: none; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--muted); font-size: 12px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.cat-chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cat-list { flex: 1; overflow-y: auto; padding: 6px 16px 24px; -webkit-overflow-scrolling: touch; }
.cat-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 8px; margin-bottom: 6px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; }
.cat-row:active { transform: scale(0.99); }
.cat-thumb { width: 52px; height: 52px; flex: none; border-radius: 8px; background: #fff; object-fit: contain; }
.cat-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cat-name { font-size: 14px; font-weight: 700; line-height: 1.25; }
.cat-meta { font-size: 11px; color: var(--muted); }
.cat-add { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 15px; font-weight: 800; }
.cat-msg { padding: 28px 8px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.6; }
.cat-sub { font-size: 11px; opacity: 0.7; }
.cat-gif { width: 100%; height: 100%; object-fit: contain; background: #fff; }
.info-lang { font-size: 10px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; }
.info-credit { font-size: 10px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
.info-credit a { color: var(--muted); }

/* EDITOR DO DIA */
.ed-wrap { display: flex; flex-direction: column; gap: 8px; }
.ed-label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.ed-label input { padding: 10px 12px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; font-weight: 600; }
.ed-row { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--card); }
.ed-ord { display: flex; flex-direction: column; gap: 4px; flex: none; }
.ed-btn { width: 30px; height: 26px; border-radius: 6px; border: 1px solid var(--border); background: var(--ov-7); color: var(--text); font-size: 10px; cursor: pointer; }
.ed-btn:disabled { opacity: 0.25; cursor: default; }
.ed-del { width: 34px; height: 34px; border-radius: 50%; color: var(--accent); font-size: 13px; }
.ed-main { flex: 1; min-width: 0; }
.ed-name { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.ed-tag { font-size: 9px; font-weight: 700; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: middle; text-transform: uppercase; }
.ed-fields { display: flex; gap: 8px; }
.ed-fields label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
.ed-fields input { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--border); background: var(--ov-4); color: var(--text); font-size: 13px; font-weight: 600; }
.ed-add, .ed-reset { padding: 13px; border-radius: var(--r-sm); border: 1px dashed var(--border); background: transparent; color: var(--text); font-size: 14px; font-weight: 700; cursor: pointer; margin-top: 4px; }
.ed-add { border-style: solid; background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none; color: var(--on-accent); }
.ed-reset { color: var(--muted); font-size: 13px; }
/* histórico por exercício, aviso de recorde, referência no guiado */
.hx { display: flex; flex-direction: column; gap: 10px; }
.hx-back { align-self: flex-start; min-height: 44px; }
.hx-name { font-size: 18px; margin: 4px 0 0; }
.hx-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.hx-rec { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.hx-k { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.hx-rec b { font-size: 16px; }
.hx-s { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.hx-per { margin-top: 2px; }
.hx-day { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.hx-day-h, .hx-set { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 14px; }
.hx-day-h small { color: var(--muted); font-size: 11px; margin-left: 6px; }
.hx-foot { font-size: 12px; color: var(--muted); }
.hx-b { min-width: 44px; min-height: 44px; border-radius: var(--r-sm); border: 1px solid var(--border); background: transparent; color: var(--text); font-size: 16px; cursor: pointer; margin-left: 4px; }
.hx-b.ok { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hx input[type=number], .hx input[type=date] { padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg, var(--bg-fallback)); color: var(--text); font: inherit; min-height: 44px; width: 96px; }
.hx input[type=date] { width: auto; flex: 1; }
.hx-form { gap: 10px; }
.hx-act { display: flex; gap: 8px; }
.hx-add, .hx-link { align-self: flex-start; margin-top: 8px; min-height: 44px; }
.hx-row { width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
#toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 12px); transform: translate(-50%, -140%); max-width: calc(100vw - 32px); z-index: 800; padding: 10px 16px; border-radius: 999px; background: var(--toast-bg); color: var(--on-primary); border: 1px solid var(--accent2, var(--danger-a034)); font-size: 14px; font-weight: 600; pointer-events: none; opacity: 0; transition: transform .25s, opacity .25s; text-align: center; }

@keyframes mvPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* aulas de ginásio */
.cl-card { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
.cl-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 10px 12px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); }
.cl-main { min-width: 0; } .cl-name { font-size: 15px; font-weight: 700; overflow-wrap: anywhere; }
.cl-main small, .cl-note { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.cl-st { font-size: 11px; font-weight: 700; color: var(--muted); text-align: right; }
.cl-row.s-done .cl-st { color: var(--success); } .cl-row.s-cancelled, .cl-row.s-replaced { opacity: 0.75; }
.cl-acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; } .cl-acts:empty { display: none; }
.cl-acts .reset-btn { min-height: 44px; }
.cl-sheet { max-height: 92vh; overflow-y: auto; } #clBody { display: flex; flex-direction: column; gap: 8px; }
.cl-lbl { font-size: 12px; font-weight: 700; color: var(--muted); margin-top: 4px; }
.cl-in { padding: 10px; border-radius: var(--r-sm); border: 1px solid var(--border); background: var(--bg, var(--bg-fallback)); color: var(--text); font: inherit; min-height: 44px; width: 100%; box-sizing: border-box; }
.cl-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.wk-c { display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); margin: 1px auto 0; }

/* Di?rio alimentar: tokens partilhados nos dois temas; alvos t?teis de 44 px. */
.diary-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
.diary-row h2 { font-size:16px; margin:0; min-width:0; }
.diary-date { flex-wrap:nowrap; margin:6px 0; }
.diary-date-label { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
.diary-date label { flex:1; min-width:120px; color:var(--muted); font-size:12px; }
.diary-date input { display:block; width:100%; min-width:0; min-height:44px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:4px; }
.diary-summary { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:10px 12px; margin:8px 0; }
.diary-meal { padding:8px 0; margin:4px 0; border-bottom:1px solid var(--border); }
.diary-count { color:var(--muted); font-size:12px; }
.diary-compact-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:4px 0 10px; }
.diary-compact { min-width:0; overflow-wrap:anywhere; }
.diary-compact b { display:block; font-size:24px; line-height:1.3; }
.diary-compact small { display:block; color:var(--muted); font-size:12px; line-height:1.4; }
.diary-add-quick { width:100%; }
.diary-full>summary { min-height:44px; padding:12px 0; box-sizing:border-box; cursor:pointer; }
.diary-full>summary:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
.diary-meal .ndisc { margin:6px 0; }
.nutri-wrap .day-hdr-name { margin-bottom:6px; }
.diary-summary { box-shadow:var(--shadow); }
.diary-total { padding:10px 0; border-bottom:1px solid var(--border); }
.diary-total:last-child { border-bottom:0; }
.diary-total>div:first-child { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; }
.diary-total b { font-size:var(--fs-lg); line-height:1.2; }
.diary-total small { display:block; color:var(--muted); line-height:1.5; margin-top:3px; }
.diary-bar { position:relative; height:6px; background:var(--border); margin-top:7px; border-radius:3px; overflow:hidden; }
.diary-bar span { display:block; height:100%; background:var(--blue); }
.diary-bar i { position:absolute; top:0; height:100%; width:2px; background:var(--text); }
.diary-entry { display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:5px; width:100%; min-width:0; padding:12px 4px; min-height:52px; background:transparent; color:var(--text); border:0; border-bottom:1px solid var(--border); font:inherit; overflow-wrap:anywhere; }
.diary-entry span { font-size:12px; color:var(--muted); }
.nutri-preferences>summary,.food-sheet summary { min-height:44px; padding:12px 0; cursor:pointer; color:var(--text); }
.food-sheet-bg { display:none; position:fixed; inset:0; background:var(--overlay-bg,rgba(0,0,0,.65)); z-index:var(--z-sheet,700); padding:12px 12px 0; align-items:flex-end; justify-content:center; }
.food-sheet-bg.show { display:flex; }
.food-sheet { width:100%; max-width:560px; max-height:90dvh; overflow-y:auto; overflow-x:hidden; padding:16px; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:18px 18px 0 0; box-sizing:border-box; overscroll-behavior:contain; }
.food-sheet h2 { font-size:19px; }
.food-sheet h3 { overflow-wrap:anywhere; }
body.food-sheet-open { overflow:hidden; }
body.food-sheet-open #bnav { visibility:hidden; }
.food-name { display:flex; align-items:center; gap:8px; }
.food-name h3 { flex:1; min-width:0; }
.food-sheet .nfield { display:flex; flex-direction:column; gap:6px; margin:12px 0; }
.food-sheet input,.food-sheet select { min-width:0; width:100%; box-sizing:border-box; min-height:44px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; }
.food-sheet button,.nutri-wrap button { min-height:44px; min-width:44px; white-space:normal; font:inherit; border-radius:var(--r-sm); padding:8px 10px; cursor:pointer; }
.food-result { display:flex; align-items:center; gap:6px; }
.food-result .diary-entry { flex:1; }
.food-sheet .qfoods { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
.food-sheet .food-check { display:flex; align-items:center; min-height:44px; gap:8px; }
.food-check input { width:24px; }
.food-sheet .food-source { flex:0 0 var(--tap); padding:0; border:0; background:transparent; color:var(--muted); font-size:var(--fs-lg); }
.food-sheet { padding-bottom:max(16px,env(safe-area-inset-bottom)); }
.food-actions { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.food-actions button { width:100%; margin:0; }
.food-sheet .btn-danger { background:transparent; border:1px solid var(--danger-border); color:var(--danger); font-weight:600; }
/* ⓘ discreto: glifo ~18 px, alvo de toque 44×44, à direita da linha */
.nref { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; color:var(--muted); }
.nref>span { flex:1; min-width:0; overflow-wrap:anywhere; }
.nref b { color:var(--text); }
.nutri-wrap .info-i { flex:none; min-width:44px; min-height:44px; padding:0; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:0; color:var(--muted); font-size:18px; line-height:1; }


/* Bloco 1: apenas a folha Mais e texto dos ecrãs abrangidos. */
#sheetBg .sheet { max-height:88dvh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; padding-top:0; padding-bottom:max(16px,env(safe-area-inset-bottom)); box-sizing:border-box; }
#sheetBg .sheet > * { flex-shrink:0; }
#sheetBg .mais-head { position:sticky; top:0; z-index:1; background:var(--surface); display:flex; align-items:center; justify-content:space-between; gap:12px; padding:0; }
#sheetBg .mais-close { flex:none; width:44px; height:44px; display:grid; place-items:center; padding:0; color:var(--muted); background:transparent; border:0; border-radius:8px; cursor:pointer; }
#sheetBg .mais-close:hover { color:var(--text); }
#sheetBg .sheet-title { font-size:18px; color:var(--text); }
#sheetBg .sheet-sub { margin:12px 4px 4px; font-size:12px; }
#sheetBg .sheet-item { min-height:44px; overflow-wrap:anywhere; }
#sheetBg .sheet-item > span:first-child { min-width:0; }
#sheetBg .theme-choice { min-width:0; }
.nutri-wrap .ndisc { font-size:13px; font-style:normal; }
.nutri-wrap .ntar-l, .nutri-wrap .qfood, .nutri-wrap .iitem-t,
.today-top .wk-row-st, .nutri-wrap .wk-row-st, #content:has(.today-strip) .cl-st,
.nutri-wrap .hx-k, .nutri-wrap .hx-day-h small, .nutri-wrap .mm-ex small,
.nutri-wrap .lc-next-s, .nutri-wrap .lc-prog-t { font-size:12px; }
#dataInfo { font-size:13px; color:var(--text); overflow-wrap:anywhere; min-width:0; }
#dataInfo p { margin:8px 0; }
#dataInfo #dataDetail { white-space:pre-line; }
#dataInfo button, #dataInfo summary { min-height:44px; font-size:13px; max-width:100%; }
#dataInfo button { background:var(--card2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; }
#dataInfo summary { cursor:pointer; padding:12px 0; }
</style>
</head>
<body>

<!-- REST TIMER -->
<div id="timerBanner">
  <div class="t-left">
    <div class="t-ring">
      <svg viewBox="0 0 48 48" width="54" height="54">
        <circle class="t-ring-bg"   cx="24" cy="24" r="22" fill="none" stroke-width="4"/>
        <circle class="t-ring-fill" id="tRingFill" cx="24" cy="24" r="22" fill="none" stroke-width="4"
                stroke-linecap="round"/>
      </svg>
      <span class="t-num" id="tNum">1:00</span>
    </div>
    <div class="t-info">
      <div class="t-label">Descanso</div>
      <div class="t-big" id="tBig">1:00</div>
    </div>
  </div>
  <div class="t-right">
    <button class="t-btn plus btn-ghost" onclick="timerAdd(30)">+30s</button>
    <button class="t-btn btn-ghost" aria-label="Fechar descanso" onclick="timerDismiss()">✕</button>
  </div>
</div>

<!-- HEADER -->
<div id="hdr">
  <div class="hdr-top">
    <div>
      <button class="hdr-title hdr-home" aria-label="Ir para Hoje" onclick="render('__hoje')">💪 Treino</button>
      <div class="hdr-sub" id="hdrSub">Seleciona um dia</div>
    </div>
    <div class="hdr-timer-row">
      <button class="hdr-timer-adj btn-ghost" aria-label="Menos 15 segundos" onclick="adjustRest(-15)">−</button>
      <button class="hdr-timer-btn btn-ghost" onclick="timerStart(REST_SEC)">⏱ <span id="restLabel">60s</span></button>
      <button class="hdr-timer-adj btn-ghost" aria-label="Mais 15 segundos" onclick="adjustRest(15)">+</button>
    </div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:0"></div></div>
</div>

<!-- MAIN -->
<div id="content"></div>

<!-- NAVEGAÇÃO INFERIOR (js/nav.js) -->
<nav id="bnav" aria-label="Navegação principal">
  <div class="nav-livewrap"><button id="navLive" class="nav-live" type="button" hidden><span class="nl-t"></span><span>Abrir ›</span></button><button id="navPause" class="nav-drop" type="button" hidden aria-label="Pausar treino">⏸</button><button id="navEnd" class="nav-drop" type="button" hidden aria-label="Encerrar o treino à hora da última atividade">✓</button><button id="navDrop" class="nav-drop" type="button" hidden aria-label="Descartar treino por terminar">✕</button></div>
  <div class="nav-row" id="navRow"></div>
</nav>

<!-- INFO MODAL (ficha técnica) -->
<div id="infoBg" class="info-bg" onclick="closeInfo()">
  <div class="info-card" role="dialog" aria-modal="true" aria-label="Ficha técnica" onclick="event.stopPropagation()">
    <button class="info-close" onclick="closeInfo()" aria-label="Fechar">✕</button>
    <div id="infoBody"></div>
  </div>
</div>


<!-- ACOLHIMENTO / PLANO (js/onboarding.js) -->
<div id="onbBg" class="onb-bg" role="dialog" aria-modal="true" aria-label="Plano de treino"><div id="onbBody" class="onb-body"></div></div>
<div id="notice" class="notice" role="status" aria-live="polite"></div>

<!-- CATÁLOGO (pesquisa dos 1324 exercícios) -->
<div id="catBg" class="cat-bg" role="dialog" aria-modal="true" aria-label="Catálogo de exercícios">
  <div class="cat-hdr">
    <input id="catQ" class="cat-q" type="search" placeholder="Pesquisar (em inglês): squat, curl, row…"
           autocomplete="off" oninput="catInput(this.value)">
    <button class="cat-close" onclick="closeCatalog()" aria-label="Fechar">✕</button>
  </div>
  <div id="catFilters" class="cat-filters"></div>
  <div id="catList" class="cat-list"></div>
</div>
<!-- TREINO GUIADO -->
<div id="woBg" class="wo-bg" role="dialog" aria-label="Treino guiado">
  <div id="woBody" class="wo-body"></div>
</div>

<!-- SCANNER CÓDIGO DE BARRAS -->
<div id="scanBg" class="scan-bg" role="dialog" aria-modal="true" aria-label="Ler código de barras">
  <video id="scanVid" class="scan-vid" playsinline muted></video>
  <div class="scan-frame"></div>
  <div class="scan-hint">Aponta a câmara ao código de barras</div>
  <button class="scan-close" onclick="stopScan()">✕ Cancelar</button>
</div>

<!-- SETTINGS SHEET -->
<div id="sheetBg" class="sheet-bg" onclick="closeSheet()">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" onclick="event.stopPropagation()">
    <div class="mais-head"><h2 class="sheet-title" id="sheetTitle">Mais</h2><button type="button" class="mais-close" aria-label="Fechar" onclick="closeSheet()"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true" focusable="false"><path d="M3 3l12 12M15 3L3 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button></div>
    <h3 class="sheet-sub">Ir para</h3>
    <button class="sheet-item" onclick="closeSheet();goDay('__plano')">
      <span>📋 Plano</span><span class="sheet-arrow">›</span>
    </button>
    <button class="sheet-item" onclick="closeSheet();goDay('__eu')">
      <span>👤 Perfil</span><span class="sheet-arrow">›</span>
    </button>
    <button class="sheet-item" onclick="closeSheet();goDay('__hist')">
      <span>📅 Histórico</span><span class="sheet-arrow">›</span>
    </button>
    <h3 class="sheet-sub">Aparência</h3>
    <fieldset class="theme-choice"><legend>Tema</legend>
      <label><input type="radio" name="theme" value="light" onchange="setThemePref(this.value)">Claro</label>
      <label><input type="radio" name="theme" value="dark" onchange="setThemePref(this.value)">Escuro</label>
      <label><input type="radio" name="theme" value="auto" onchange="setThemePref(this.value)">Automático (sistema)</label>
    </fieldset>
    <h3 class="sheet-sub">Aplicação</h3>
    <button class="sheet-item" onclick="toggleWake()">
      <span>🔆 Manter ecrã ligado</span>
      <span class="sw" id="wakeSw"></span>
    </button>
    <button class="sheet-item" onclick="enableNotif()">
      <span>🔔 Notificar fim do descanso</span>
      <span class="sw" id="notifSw"></span>
    </button>
    <div class="sheet-note" id="wakeNote"></div>
    <h3 class="sheet-sub">Dados</h3>
    <div id="dataInfo" aria-live="polite">
      <p id="dataSize"></p><p id="dataSave"></p>
      <p id="dataPrepared"></p><p id="dataDownload"></p><p id="dataVerified"></p>
      <div id="dataAdvice" hidden><p id="dataAdviceText"></p><button onclick="dismissDataAdvice()">Dispensar</button></div>
      <button onclick="document.getElementById('verifyBackupInput').click()">Verificar um backup</button>
      <input id="verifyBackupInput" type="file" accept=".json,application/json" hidden onchange="verifyBackupFile(event)">
      <details><summary>Ver detalhe</summary><p id="dataDetail"></p><button onclick="exportCopy()">Exportar cópia de recuperação</button></details>
    </div>
    <button class="sheet-item" onclick="exportBackup()">
      <span>⬇️ Exportar backup de tudo (.json)</span><span class="sheet-arrow">›</span>
    </button>
    <button class="sheet-item" onclick="document.getElementById('importFile').click()">
      <span>⬆️ Importar backup</span><span class="sheet-arrow">›</span>
    </button>
    <input type="file" id="importFile" accept="application/json,.json" hidden onchange="importBackup(event)">
    <div class="sheet-sub">Exportar para folha de cálculo (CSV)</div>
    <button class="sheet-item" onclick="exportMeasuresCSV()"><span>📏 Medidas CSV</span><span class="sheet-arrow">↓</span></button>
    <button class="sheet-item" onclick="exportIntakeCSV()"><span>🍽️ Diário alimentar CSV</span><span class="sheet-arrow">↓</span></button>
    <button class="sheet-item" onclick="exportLoadCSV()"><span>🏋️ Cargas CSV</span><span class="sheet-arrow">↓</span></button>
    <h3 class="sheet-sub">Sobre</h3>
    <button class="sheet-item" onclick="openAbout()"><span id="appVersionLabel">Versão</span><span class="sheet-arrow">›</span></button>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
