<!doctype html>
<html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>myTraining · protótipo UX V2 (demonstração)</title><meta name="robots" content="noindex"><meta name="theme-color" content="#111111">
<style>
/* MOCKUP isolado: dados falsos, sem storage, sem rede. Tokens copiados da app (index.html :root). */
:root{--bg:#0a0a0f;--card:#16161f;--card2:#1c1c28;--border:rgba(255,255,255,.07);--accent:#ef4444;--accent2:#f97316;--green:#22c55e;--blue:#3b82f6;--text:#f1f5f9;--muted:rgba(241,245,249,.66);--primary-solid:#dc2626;--on-primary:#fff;--ok-bg:#0d2010;--warn:#fbbf24;--r:14px;--tap:44px}
:root[data-theme=light]{--bg:#f8fafc;--card:#fff;--card2:#f1f5f9;--text:#0f172a;--muted:#475569;--border:rgba(15,23,42,.10);--accent:#dc2626;--green:#166534;--blue:#1d4ed8;--ok-bg:#dcfce7;--warn:#92400e}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;min-height:var(--tap)}
#app{position:relative;max-width:480px;min-height:100dvh;margin:0 auto;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.hdr h1{font-size:22px;font-weight:800}.hdr small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:1px solid var(--border)}
.ico svg,.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wrap{padding:0 16px}
.days{display:flex;gap:6px;padding:8px 16px}
.days button{flex:1;min-height:52px;border-radius:12px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--muted);display:grid;place-items:center;line-height:1.1}
.days b{font-size:14px;color:var(--text)}.days .on{border-color:var(--accent);} .days .dn{opacity:.55}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-top:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--warn)}
.card h2{font-size:26px;line-height:1.15;margin:4px 0 2px;font-weight:800}.muted{color:var(--muted);font-size:14px}
.cta{width:100%;min-height:54px;border-radius:12px;background:linear-gradient(90deg,var(--primary-solid),#c2410c);color:var(--on-primary);font-weight:800;font-size:17px;margin-top:14px}
.link{color:var(--blue);font-weight:600;font-size:14px;min-height:44px;padding:0 4px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-top:1px solid var(--border);width:100%;text-align:left}
.row:first-child{border-top:0}.row .g{flex:1}.row small{display:block;color:var(--muted);font-size:13px}.chev{color:var(--muted)}
.hint{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--border);width:100%;text-align:left;min-height:48px;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.sec{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 0 4px}
.bar{height:8px;border-radius:99px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}
.seg{display:flex;gap:6px;padding:8px 16px;overflow-x:auto}.seg button{white-space:nowrap;padding:0 14px;border-radius:99px;background:var(--card);border:1px solid var(--border);font-size:14px;font-weight:600}.seg .on{background:var(--text);color:var(--bg)}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav button{flex:1;display:grid;place-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--muted);padding:8px 0 6px;min-height:62px}
.nav .on{color:var(--accent)}
.nav .mid{margin-top:-18px;flex:0 0 76px;height:64px;min-height:64px;border-radius:20px 20px 0 0;background:var(--primary-solid);color:#fff}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none}.sheet-bg.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px 28px;border-top:1px solid var(--border)}
.demo{position:fixed;top:0;left:0;right:0;z-index:99;background:#111;color:#fff;font-size:12px;padding:6px 10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.demo button{min-height:28px;padding:0 10px;border-radius:99px;background:#333;color:#fff;font-size:12px}.demo .on{background:#dc2626}
body.hasbar #app{padding-top:46px}
.mk{display:flex;justify-content:space-between;font-weight:700}
.wo{padding:0 16px}.wo .top{display:flex;justify-content:space-between;align-items:center;padding:12px 0}.wo .big{font-size:30px;font-weight:800;margin-top:20px}
.stepper{display:flex;gap:12px;margin-top:28px}.stepper div{flex:1;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;font-size:28px;font-weight:800}.stepper small{display:block;font-size:12px;color:var(--muted);font-weight:500}
.rest{margin-top:20px;background:var(--ok-bg);border:1px solid var(--green);border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.rest b{font-size:34px}
.done{width:100%;min-height:58px;border-radius:12px;background:var(--green);color:#fff;font-weight:800;font-size:18px;margin-top:16px}
@media(min-width:900px){body{background:#000}#app{margin-top:12px;border:1px solid var(--border);border-radius:28px;min-height:calc(100dvh - 24px);background:var(--bg);overflow:hidden}.nav{position:absolute;bottom:0}}
</style></head><body>
<div id="demobar" class="demo"></div>
<div id="app"></div>
<div id="sb" class="sheet-bg"><div class="sheet" id="sheet"></div></div>
<script>
const Q=new URLSearchParams(location.search);
const S={alt:(Q.get('alt')||'a').toLowerCase(),theme:Q.get('theme')||'dark',screen:Q.get('screen')||'hoje',tab:Q.get('tab')||(Q.get('alt')==='b'?'resumo':'cargas'),bar:Q.get('bar')!=='0',rest:Q.get('rest')?1:0};
const I={hoje:'<path d="M3 11l9-8 9 8v10H3z"/>',plano:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',nutri:'<path d="M12 21c-5 0-8-4-8-9 3 0 5 1 8 4 3-3 5-4 8-4 0 5-3 9-8 9zM12 3c0 3-1 5-3 6"/>',prog:'<path d="M3 20h18M6 16V9M12 16V4M18 16v-5"/>',play:'<path d="M7 4l13 8-13 8z" fill="currentColor"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',back:'<path d="M15 4l-8 8 8 8"/>',dots:'<circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${I[n]}</svg>`;
const NAV={a:[['hoje','Hoje','hoje'],['plano','Semana','plano'],['prog','Evolução','prog'],['nutri','Nutrição','nutri'],['eu','Mais','dots']],
           b:[['hoje','Hoje','hoje'],['plano','Plano','plano'],['treino','Treino','play'],['nutri','Nutrição','nutri'],['prog','Progresso','prog']]};
const go=(s,t)=>{S.screen=s;if(t)S.tab=t;draw();scrollTo(0,0)};
function hdr(t,sub,right=true){return `<div class="hdr"><div><h1>${t}</h1>${sub?`<small>${sub}</small>`:''}</div>${right&&S.alt==='b'?`<button class="ico" aria-label="Definições e perfil" onclick="go('eu')">${ic('gear')}</button>`:''}</div>`}
const days=`<div class="days" role="tablist">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map((d,i)=>`<button class="${i==0?'on':''} ${[3,5,6].includes(i)?'dn':''}"><span>${d}</span><b>${[3,5,6].includes(i)?'–':'·'}</b></button>`).join('')}</div>`;
const SCR={
hoje:()=>hdr('Hoje','Domingo, 25 outubro')+days+`<div class="wrap">
 <div class="card"><span class="tag">Em atraso · Segunda</span><h2>Pernas &amp; Ombros</h2><div class="muted">~55 min · 7 exercícios · Leg press, Cadeira extensora, Mesa flexora +4</div>
  <button class="cta" onclick="go('treino')">▶ Começar treino</button>
  <div style="display:flex;justify-content:space-between"><button class="link" onclick="sheet('quick')">Pouco tempo? Versão rápida</button><button class="link" onclick="go('plano')">Ver plano</button></div>
  <button class="row" style="min-height:48px" onclick="go('treino')"><span class="g">Ver exercícios e registar manualmente</span><span class="chev">›</span></button></div>
 <button class="hint" onclick="sheet('adapt')"><span class="dot"></span><span style="flex:1">1 sugestão para esta semana</span><span class="chev">›</span></button>
 <button class="hint" onclick="go('nutri')"><span style="flex:1">Comida de hoje · <b>1625 kcal</b> · 77 g proteína</span><span class="chev">›</span></button>
 <div class="hint"><span style="flex:1">Hoje · Pilates 18:30 · 50 min</span><button class="link" style="min-height:44px">Fiz</button></div></div>`,
treino:()=>`<div class="wo"><div class="top"><button onclick="go('hoje')">‹ Sair</button><div style="text-align:center"><b>1/7 · 0:01</b><small class="muted" style="display:block">Pernas &amp; Ombros</small></div><button>⏸ Pausar</button></div>
 <div class="big">Leg press</div><div class="muted" style="margin-top:4px"><b>4 séries · 8-10 reps</b> · Última vez 30 kg × 10 · Próximo 30 kg × 9</div>
 <div style="height:${S.rest?'80':'190'}px;background:var(--card);border-radius:14px;margin-top:16px;display:grid;place-items:center" class="muted">demonstração do exercício</div>
 ${S.rest?`<div class="rest"><div><small class="muted">DESCANSO</small><br><b>1:29</b></div><div><button class="link" onclick="">+30 s</button><button class="link" onclick="S.rest=0;draw()">Saltar</button></div></div>`:''}
 <div class="stepper"><div>30<small>kg</small></div><div>8<small>reps</small></div></div>
 <button class="done" onclick="S.rest=1;draw()">✓ Concluir série 1</button>
 <div style="display:flex;gap:8px;margin-top:10px">${['Ficha','Trocar','Próximo ›'].map(x=>`<button class="ico" style="flex:1;border-radius:12px;width:auto">${x}</button>`).join('')}</div></div>`,
nutri:()=>hdr('Nutrição','')+`<div class="seg"><button>‹</button><button class="on">Hoje</button><button>›</button></div><div class="wrap">
 <div class="card" style="margin-top:4px"><div class="mk"><span>1625 kcal</span><span class="muted">de ~2600 · estimativa</span></div><div class="bar" style="margin:8px 0"><i style="width:64%"></i></div>
  <div class="mk"><span>Proteína 77 g</span><span class="muted">ref. 125–170 g</span></div><div class="bar" style="margin-top:8px"><i style="width:52%"></i></div>
  <button class="link" onclick="sheet('res')" style="margin-top:6px">Resumo completo e fontes ⓘ</button></div>
 ${[['Pequeno-almoço','Aveia 60 g · Leite 250 ml · Banana','437 kcal'],['Almoço','Frango 150 g · Arroz 180 g · Brócolos +1','967 kcal'],['Jantar','Sem registos',''],['Lanches','Iogurte 125 g · Amêndoas 25 g','221 kcal']].map(m=>`<div class="card" style="padding:8px 16px"><div class="row" style="border:0"><div class="g"><b>${m[0]}</b><small>${m[1]}</small></div><span class="muted">${m[2]}</span><button class="ico" aria-label="Adicionar" style="font-size:22px">+</button></div></div>`).join('')}</div>`,
plano:()=>hdr(S.alt=='a'?'Semana':'Plano','4 treinos por fazer · 2 aulas')+`<div class="wrap">${[['Seg','Pernas & Ombros','Em atraso · 55 min'],['Ter','Peito & Tríceps · Pilates 18:30','50 min'],['Qua','Costas & Bíceps','50 min'],['Qui','Descanso · Spinning 19:00','45 min'],['Sex','Full Body','45 min'],['Sáb','Caminhada',''],['Dom','Descanso','Hoje']].map(d=>`<div class="card" style="padding:4px 16px;margin-top:8px"><button class="row" style="border:0" onclick="go('treino')"><b style="width:36px">${d[0]}</b><div class="g">${d[1]}<small>${d[2]}</small></div><span class="chev">›</span></button></div>`).join('')}
 <div style="display:flex;gap:8px;margin-top:14px"><button class="ico" style="flex:1;border-radius:12px;width:auto" onclick="sheet('plan')">Gerir plano</button><button class="ico" style="flex:1;border-radius:12px;width:auto">+ Aula</button></div></div>`,
prog:()=>hdr(S.alt==='a'?'Evolução':'Progresso','')+`<div class="seg">${[['resumo','Resumo'],['cargas','Cargas'],['corpo','Corpo'],['hist','Histórico']].map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="go('prog','${t[0]}')">${t[1]}</button>`).join('')}</div><div class="wrap">`+({
 resumo:`<div class="card"><b>A tua semana</b><div class="muted">1 treino · 1 de 4 do plano</div><div class="bar" style="margin-top:10px"><i style="width:25%"></i></div></div><div class="sec">Conquistas · 2 de 8</div><div class="card" style="display:flex;gap:10px">🌱 <span><b>Primeiro treino</b><br><span class="muted">27/09</span></span></div><button class="link" style="margin-top:6px">Ver as 6 por conseguir ›</button>`,
 cargas:`<div class="sec">Exercícios</div><div class="card" style="padding:4px 16px">${['Arnold press','Cadeira extensora','Leg press','Mesa flexora'].map(x=>`<button class="row"><div class="g"><b>${x}</b><small>5 sessões · 22/10</small></div><span class="chev">›</span></button>`).join('')}</div>`,
 corpo:`<div class="card"><b>Peso</b> 79.1 kg <span class="muted">−1.3 kg desde o início</span></div><button class="hint">+ Registar medidas</button><div class="sec">Músculos · 7 dias</div><div class="card muted">Mapa muscular (igual ao atual)</div>`,
 hist:`<div class="sec">Treinos recentes</div><div class="card" style="padding:4px 16px">${['22/10 · Segunda','15/10 · Segunda','11/10 · Segunda'].map(x=>`<button class="row"><div class="g"><b>${x}</b><small>50:00 · concluído</small></div><span class="chev">Resumo ›</span></button>`).join('')}</div>`}[S.tab])+`</div>`,
eu:()=>`<div class="hdr">${S.alt==='b'?`<button class="ico" onclick="go('hoje')" aria-label="Voltar">${ic('back')}</button>`:''}<h1 style="flex:1;margin-left:12px">${S.alt==='a'?'Mais':'Eu'}</h1></div><div class="wrap">
 <div class="sec">Perfil</div><div class="card" style="padding:4px 16px">${[['Dados pessoais','Sexo, idade, altura, objetivo'],['Preferências de treino','Dias, equipamento, limitações']].map(x=>`<button class="row"><div class="g"><b>${x[0]}</b><small>${x[1]}</small></div><span class="chev">›</span></button>`).join('')}</div>
 <div class="sec">Aplicação</div><div class="card" style="padding:4px 16px">${['Aparência · Automático','Manter ecrã ligado','Notificar fim do descanso'].map(x=>`<button class="row"><div class="g"><b>${x}</b></div><span class="chev">›</span></button>`).join('')}</div>
 <div class="sec">Dados</div><div class="card" style="padding:4px 16px">${['Exportar backup','Importar backup','Exportar CSV (medidas, diário, cargas)'].map(x=>`<button class="row"><div class="g"><b>${x}</b></div><span class="chev">›</span></button>`).join('')}</div></div>`
};
const SH={quick:'<b>Versão rápida de hoje</b><p class="muted" style="margin:8px 0">Menos séries, só o executado fica registado.</p><button class="cta" onclick="sheet()">Começar versão rápida</button>',
 adapt:'<b>Segunda continua pendente</b><p class="muted" style="margin:8px 0">Esta semana não há um dia livre sem sobrecarregar.</p><button class="cta" onclick="sheet()">Versão rápida hoje</button><button class="link" onclick="sheet()" style="width:100%">Percebi</button>',
 res:'<b>Resumo do dia</b><p class="muted" style="margin:8px 0">Energia 1625 kcal · Proteína 77 g · Hidratos 243 g · Gordura 45 g · Fibra 18 g · Açúcares totais 37 g · Sal 2,1 g — cada um com a sua referência e ⓘ (fórmula, fonte, limites).</p>',
 plan:'<b>Gerir plano</b><button class="row">Criar plano novo</button><button class="row">Reorganizar a semana</button><button class="row">Substituir treino por aula</button>'};
function sheet(k){const b=document.getElementById('sb');if(!k){b.classList.remove('on');return}document.getElementById('sheet').innerHTML=SH[k];b.classList.add('on')}
document.getElementById('sb').onclick=e=>{if(e.target.id=='sb')sheet()};
function draw(){
 document.documentElement.dataset.theme=S.theme;
 const live=S.screen==='treino', ids=NAV[S.alt];
 const cur=S.screen;
 document.getElementById('app').innerHTML=SCR[S.screen]()+(live?'':`<nav class="nav" aria-label="Navegação principal">${ids.map(([id,l,i])=>id==='treino'?`<button class="mid" onclick="go('treino')" aria-label="Iniciar treino">${ic('play')}<span>Iniciar</span></button>`:`<button class="${cur===id?'on':''}" onclick="go('${id}')">${ic(i)}<span>${l}</span></button>`).join('')}</nav>`);
 document.body.classList.toggle('hasbar',S.bar);const d=document.getElementById('demobar');d.setAttribute('role','note');d.style.display=S.bar?'flex':'none';
 d.innerHTML=`<b>DEMONSTRAÇÃO · não é a app</b> Proposta: ${['a','b'].map(x=>`<button class="${S.alt==x?'on':''}" onclick="S.alt='${x}';go('hoje')">${x=='a'?'1 Estável · aprovada':'2 Central · arquivada'}</button>`).join('')} Tema: ${['dark','light'].map(x=>`<button class="${S.theme==x?'on':''}" onclick="S.theme='${x}';draw()">${x}</button>`).join('')} <button onclick="S.rest=1;go('treino')">descanso</button>`;
}
draw();
</script></body></html>
