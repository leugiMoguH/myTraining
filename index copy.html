<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino</title>

<style>
body{
margin:0;
font-family:system-ui;
background:#0b1220;
color:#fff;
}

header{
padding:16px;
text-align:center;
font-size:18px;
font-weight:700;
background:#111827;
}

.tabs{
display:flex;
overflow-x:auto;
background:#0f172a;
border-bottom:1px solid #222;
}

.tab{
padding:12px;
white-space:nowrap;
cursor:pointer;
opacity:0.6;
}

.tab.active{
opacity:1;
border-bottom:2px solid #ef4444;
}

.container{
padding:12px;
}

.card{
background:#111827;
border-radius:12px;
margin-bottom:16px;
overflow:hidden;
}

.title{
padding:12px;
font-weight:700;
}

.meta{
padding:0 12px 12px;
font-size:13px;
opacity:0.8;
}

.slider{
position:relative;
width:100%;
overflow:hidden;
}

.slides{
display:flex;
transition:transform 0.3s ease;
}

.slides img{
width:100%;
flex-shrink:0;
}

.controls{
display:flex;
justify-content:space-between;
padding:8px;
}

button{
background:#ef4444;
border:none;
color:#fff;
padding:6px 10px;
border-radius:6px;
font-size:12px;
}
</style>

</head>

<body>

<header>Plano de Treino</header>

<div class="tabs" id="tabs"></div>
<div class="container" id="content"></div>

<script>

const data = {
"Segunda":[
{name:"Supino reto",series:4,reps:"6-10",images:["/images/segunda/img1.jpg","/images/segunda/img2.jpg","/images/segunda/img4.jpg","/images/segunda/img3.jpg","/images/segunda/img5.jpg","/images/segunda/img6.jpg"]},
{name:"Supino inclinado",series:3,reps:"8-12",images:["/images/segunda/imgsi1.jpg","/images/segunda/imgsi2.jpg","/images/segunda/imgsi3.jpg"]},
{name:"Crucifixo",series:3,reps:"10-12",images:["/images/segunda/imgcru1.jpg","/images/segunda/imgcru2.jpg","/images/segunda/imgcru3.jpg"]},
{name:"Paralelas",series:3,reps:"8-12",images:["/images/segunda/imgpar1.jpg","/images/segunda/imgpar2.jpg"]},
{name:"Tríceps corda",series:3,reps:"10-15",images:["/images/segunda/imgtric1.jpg"]},
{name:"Tríceps testa",series:3,reps:"10-12",images:["/images/segunda/imgtrit1.jpg"]}
],

"Terça":[
{name:"Puxada frente",series:4,reps:"8-12",images:["/images/terca/imgpux1.jpg"]},
{name:"Remada",series:3,reps:"8-12",images:["/images/terca/imgrem1.jpg"]},
{name:"Remada unilateral",series:3,reps:"10-12",images:["/images/terca/imgremu1.jpg"]},
{name:"Pulldown",series:3,reps:"10-12",images:["/images/terca/imgpull1.jpg"]},
{name:"Rosca direta",series:3,reps:"8-12",images:["/images/terca/imgrosc1.jpg"]},
{name:"Rosca alternada",series:3,reps:"10-12",images:["/images/terca/imgrosca1.jpg"]}
],

"Quarta":[
{name:"Agachamento",series:4,reps:"6-10",images:["/images/quarta/imgagac1.jpg","/images/quarta/imgagac2.jpg"]},
{name:"Leg press",series:4,reps:"10-12",images:["/images/quarta/imglegp1.jpg"]},
{name:"Stiff",series:3,reps:"8-12",images:["/images/quarta/imgsti1.jpg"]},
{name:"Mesa flexora",series:3,reps:"10-15",images:["/images/quarta/imgmesa1.jpg"]},
{name:"Cadeira extensora",series:3,reps:"12-15",images:["/images/quarta/imgcade1.jpg"]},
{name:"Panturrilha",series:4,reps:"12-20",images:["/images/quarta/imgpantu1.jpg"]}
],

"Quinta":[
{name:"Desenvolvimento",series:4,reps:"8-12",images:["/images/quinta/imgdes1.jpg"]},
{name:"Elevação lateral",series:4,reps:"12-15",images:["/images/quinta/imgelv1.jpg"]},
{name:"Posterior ombro",series:3,reps:"12-15",images:["/images/quinta/imgposto1.jpg"]},
{name:"Face pull",series:3,reps:"12-15",images:["/images/quinta/imgface1.jpg"]},
{name:"Prancha",series:3,reps:"30-60s",images:["/images/quinta/imgpranc1.jpg"]},
{name:"Abdominal",series:3,reps:"12-20",images:["/images/quinta/imgabd1.jpg"]}
],

"Sexta":[
{name:"Levantamento terra",series:3,reps:"5-8",images:["/images/sexta/imglevt1.jpg"]},
{name:"Supino",series:3,reps:"8-12",images:["/images/sexta/imgsup1.jpg"]},
{name:"Puxada alta",series:3,reps:"8-12",images:["/images/sexta/imgpuxa1.jpg"]},
{name:"Agachamento goblet",series:3,reps:"10-12",images:["/images/sexta/imgagacg1.jpg"]},
{name:"Elevação lateral",series:3,reps:"12-15",images:["/images/sexta/imgelvel1.jpg"]},
{name:"Braços",series:3,reps:"10-15",images:["/images/sexta/imgbra1.jpg"]}
],

"Sábado":[
{name:"Cardio leve",series:"-",reps:"20-30 min",images:["/images/sabado/imgcard1.jpg"]},
{name:"Core",series:3,reps:"12-20",images:["/images/sabado/imgcore1.jpg"]}
],

"Domingo":[
{name:"Descanso ativo",series:"-",reps:"Mobilidade",images:["/images/domingo/imgabd1.jpg"]}
]
};

const tabs=document.getElementById("tabs");
const content=document.getElementById("content");
let currentIndex={};

Object.keys(data).forEach((day,i)=>{
const t=document.createElement("div");
t.className="tab"+(i===0?" active":"");
t.innerText=day;
t.onclick=()=>render(day,t);
tabs.appendChild(t);
});

function render(day,el){
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
if(el)el.classList.add("active");

content.innerHTML="";

data[day].forEach((ex,i)=>{
currentIndex[i]=0;

const div=document.createElement("div");
div.className="card";

div.innerHTML=`
<div class="title">${ex.name}</div>

<div class="slider">
<div class="slides" id="slides-${i}">
${ex.images.map(img=>`<img src="${img}">`).join("")}
</div>
</div>

<div class="controls">
<button onclick="prev(${i})">Prev</button>
<button onclick="next(${i})">Next</button>
</div>

<div class="meta">
Séries: ${ex.series} | Reps: ${ex.reps}
</div>
`;

content.appendChild(div);
});
}

function update(i){
const el=document.getElementById("slides-"+i);
el.style.transform=`translateX(-${currentIndex[i]*100}%)`;
}

function next(i){
const el=document.getElementById("slides-"+i);
const total=el.children.length;
currentIndex[i]=(currentIndex[i]+1)%total;
update(i);
}

function prev(i){
const el=document.getElementById("slides-"+i);
const total=el.children.length;
currentIndex[i]=(currentIndex[i]-1+total)%total;
update(i);
}

render("Segunda");

</script>

</body>
</html>
