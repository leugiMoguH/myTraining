<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Plano de treino pessoal com acompanhamento de séries e timer de descanso.">
<title>Treino</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">

<style>
:root {
  --bg:      #0a0a0f;
  --surface: #111118;
  --card:    #16161f;
  --card2:   #1c1c28;
  --border:  rgba(255,255,255,0.07);
  --accent:  #ef4444;
  --accent2: #f97316;
  --green:   #22c55e;
  --blue:    #3b82f6;
  --text:    #f1f5f9;
  --muted:   rgba(241,245,249,0.45);
  --r:       14px;
  --r-sm:    8px;
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overscroll-behavior-y: none;
}

/* ── TIMER BANNER ─────────────────────────────────── */
#timerBanner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 300;
  padding: 10px 16px 10px 20px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: #0d2010;
  border-bottom: 2px solid var(--green);
  transform: translateY(-110%);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
#timerBanner.show { transform: translateY(0); }
#timerBanner.warn { background: #200d00; border-color: var(--accent); }

.t-left  { display: flex; align-items: center; gap: 14px; }
.t-ring  {
  width: 54px; height: 54px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  position: relative; flex-shrink: 0;
}
.t-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.t-ring-bg { stroke: rgba(255,255,255,0.1); }
.t-ring-fill {
  stroke: var(--green);
  stroke-dasharray: 138.2; /* 2π×22 */
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear, stroke 0.3s;
}
#timerBanner.warn .t-ring-fill { stroke: var(--accent); }
.t-num {
  position: relative; z-index: 1;
  font-size: 13px; font-weight: 800; color: var(--green);
}
#timerBanner.warn .t-num { color: var(--accent); }
.t-info { line-height: 1.2; }
.t-label { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
.t-big   { font-size: 28px; font-weight: 800; color: var(--green); }
#timerBanner.warn .t-big { color: var(--accent); }
.t-right { display: flex; gap: 6px; flex-shrink: 0; }
.t-btn {
  padding: 8px 12px; border-radius: var(--r-sm);
  background: rgba(255,255,255,0.07); border: 1px solid var(--border);
  color: var(--text); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.t-btn:hover { background: rgba(255,255,255,0.13); }
.t-btn.plus { color: var(--green); border-color: rgba(34,197,94,0.3); }
#timerBanner.warn .t-btn.plus { color: var(--accent); border-color: rgba(239,68,68,0.3); }

/* ── HEADER ───────────────────────────────────────── */
#hdr {
  position: sticky; top: 0; z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px 0;
}
.hdr-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  margin-bottom: 10px;
}
.hdr-title { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
.hdr-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }
.hdr-timer-btn {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 6px;
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
  color: var(--accent); padding: 9px 14px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s;
}
.hdr-timer-btn:hover { background: rgba(239,68,68,0.2); }
.hdr-timer-row { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
.hdr-timer-adj {
  width: 30px; height: 36px; border-radius: var(--r-sm);
  background: rgba(239,68,68,0.07); border: 1px solid rgba(239,68,68,0.2);
  color: var(--accent); font-size: 16px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; display: flex; align-items: center; justify-content: center;
}
.hdr-timer-adj:hover { background: rgba(239,68,68,0.18); }
.prog-bar  { height: 2px; background: var(--border); margin: 0 -20px; }
.prog-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  transition: width 0.5s ease;
}

/* ── TABS ─────────────────────────────────────────── */
.tabs {
  display: flex; gap: 2px; overflow-x: auto;
  scrollbar-width: none; padding: 10px 0 0;
  margin: 0 -20px; padding-left: 20px; padding-right: 20px;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex-shrink: 0; cursor: pointer;
  padding: 8px 14px; border-radius: var(--r-sm) var(--r-sm) 0 0;
  font-size: 13px; font-weight: 600; color: var(--muted);
  border-bottom: 2px solid transparent;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  display: flex; align-items: center; gap: 5px;
}
.tab:hover { color: var(--text); }
.tab.active {
  color: var(--accent); border-bottom-color: var(--accent);
  background: rgba(239,68,68,0.06);
}
.tab-badge {
  background: var(--green); color: #000;
  font-size: 9px; font-weight: 900; padding: 2px 5px;
  border-radius: 4px; line-height: 1;
}

/* ── CONTENT GRID ─────────────────────────────────── */
#content {
  padding: 16px; max-width: 1280px; margin: 0 auto;
  display: grid; grid-template-columns: 1fr; gap: 14px;
}
@media (min-width: 640px)  { #content { grid-template-columns: repeat(2, 1fr); padding: 20px; } }
@media (min-width: 1024px) { #content { grid-template-columns: repeat(3, 1fr); } }

/* ── DAY HEADER ───────────────────────────────────── */
.day-hdr {
  grid-column: 1/-1;
  display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
  padding-bottom: 4px; border-bottom: 1px solid var(--border);
}
.day-hdr-name { font-size: 22px; font-weight: 800; }
.day-hdr-sub  { font-size: 13px; color: var(--muted); margin-top: 2px; }
.reset-btn {
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); padding: 7px 12px; border-radius: var(--r-sm);
  font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap;
  transition: border-color 0.2s, color 0.2s;
}
.reset-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── EXERCISE CARD ────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
  transition: border-color 0.3s, background 0.3s;
  display: flex; flex-direction: column;
}
.card.done {
  border-color: rgba(34,197,94,0.25);
  background: color-mix(in srgb, var(--card) 92%, #22c55e);
}

/* image section */
.img-wrap {
  position: relative; overflow: hidden;
  background: #0d0d14;
  aspect-ratio: 4/3;
}
.card.done .img-wrap { opacity: 0.55; }
.slides {
  display: flex; height: 100%; width: 100%;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
}
.slides.drag { transition: none; }
.slide {
  flex: 0 0 100%; height: 100%;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.slide img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  user-select: none; pointer-events: none;
}
.no-img {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 10px;
  background: linear-gradient(135deg, #1a1a28 0%, #0d0d14 100%);
  color: var(--muted);
}
.no-img span:first-child { font-size: 44px; opacity: 0.5; }
.no-img span:last-child  { font-size: 13px; text-align: center; padding: 0 12px; }
.slide-prev, .slide-next {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
  border: none; color: #fff; font-size: 18px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s; z-index: 10;
}
.slide-prev { left: 8px; }
.slide-next { right: 8px; }
.slide-prev:hover, .slide-next:hover { background: rgba(0,0,0,0.8); }
.dots {
  position: absolute; bottom: 8px; left: 0; right: 0;
  display: flex; justify-content: center; gap: 5px; pointer-events: none;
}
.dot {
  width: 6px; height: 6px; border-radius: 3px;
  background: rgba(255,255,255,0.35); transition: all 0.2s; pointer-events: auto; cursor: pointer;
}
.dot.on { width: 18px; background: #fff; }

/* card body */
.card-body { padding: 14px 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }

.card-title-row {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.card-title { font-size: 16px; font-weight: 700; line-height: 1.25; }
.done-pill {
  display: none; flex-shrink: 0;
  background: var(--green); color: #000;
  font-size: 10px; font-weight: 800; padding: 3px 8px;
  border-radius: 4px; margin-top: 2px;
}
.card.done .done-pill { display: block; }

.card-stats {
  display: flex; gap: 20px;
}
.stat {
  display: flex; flex-direction: column; gap: 1px;
}
.stat-label { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.stat-val   { font-size: 20px; font-weight: 800; line-height: 1; }

/* set circles */
.sets-label { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.sets-row   { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.set-btn {
  width: 46px; height: 46px; border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04);
  color: var(--muted); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all 0.18s; display: flex; align-items: center; justify-content: center;
}
.set-btn:active { transform: scale(0.88); }
.set-btn.on {
  background: var(--green); border-color: var(--green); color: #000;
}

/* tip */
.tip {
  background: rgba(255,255,255,0.03);
  border-left: 3px solid var(--accent2);
  padding: 9px 11px; border-radius: 0 var(--r-sm) var(--r-sm) 0;
  font-size: 12px; color: var(--muted); line-height: 1.55;
}

/* alternative exercise */
.card-alt {
  font-size: 12px; color: var(--muted); line-height: 1.5;
  padding: 8px 11px; border-radius: var(--r-sm);
  background: rgba(59,130,246,0.05); border: 1px solid rgba(59,130,246,0.12);
}
.card-alt strong { color: rgba(241,245,249,0.65); font-weight: 600; }

/* action buttons */
.card-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 2px; }
.act-btn {
  flex: 1; padding: 11px 8px; border-radius: var(--r-sm);
  font-size: 13px; font-weight: 700; cursor: pointer;
  border: 1px solid; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}
.act-timer {
  background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.25); color: var(--accent);
}
.act-timer:hover { background: rgba(239,68,68,0.16); }
.act-done {
  background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.25); color: var(--green);
}
.act-done:hover  { background: rgba(34,197,94,0.16); }
.card.done .act-done { background: rgba(34,197,94,0.2); }

/* ── ANIMATIONS ───────────────────────────────────── */
@keyframes pop { 0%{transform:scale(0.85)} 60%{transform:scale(1.08)} 100%{transform:scale(1)} }
.set-btn.pop { animation: pop 0.22s ease; }

/* ── LOAD / PROGRESSÃO ────────────────────────────── */
.load { display: flex; flex-direction: column; gap: 8px; }
.load-row { display: flex; align-items: center; gap: 6px; }
.load-in {
  flex: 1 1 0; width: 0; min-width: 0; height: 38px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: var(--r-sm); color: var(--text);
  font-size: 15px; font-weight: 700; text-align: center;
  -moz-appearance: textfield;
}
.load-in::-webkit-outer-spin-button, .load-in::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.load-in::placeholder { color: var(--muted); font-weight: 600; }
.load-in:focus { outline: none; border-color: var(--accent); background: rgba(239,68,68,0.06); }
.load-x { color: var(--muted); font-size: 13px; font-weight: 700; flex-shrink: 0; }
.load-save {
  flex-shrink: 0; height: 38px; padding: 0 12px; border-radius: var(--r-sm);
  background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.28);
  color: var(--accent); font-size: 13px; font-weight: 700; cursor: pointer; transition: background 0.15s;
}
.load-save:hover { background: rgba(239,68,68,0.18); }
.load-save.ok { background: var(--green); border-color: var(--green); color: #000; }
.load-chart-btn {
  flex-shrink: 0; width: 38px; height: 38px; border-radius: var(--r-sm);
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  font-size: 15px; cursor: pointer; transition: background 0.15s;
}
.load-chart-btn:hover { background: rgba(255,255,255,0.1); }
.lc { background: rgba(255,255,255,0.02); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 10px; }
.lc-svg { width: 100%; height: auto; display: block; overflow: visible; }
.lc-empty { font-size: 12px; color: var(--muted); line-height: 1.5; text-align: center; padding: 6px 4px; }
.lc-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.lc-meta b { color: var(--text); font-size: 14px; }
.lc-1rm { color: var(--accent2); font-weight: 700; }
.lc-range { margin-left: auto; }

/* ── HEADER GEAR ──────────────────────────────────── */
.hdr-gear {
  width: 36px; height: 36px; border-radius: var(--r-sm);
  background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  color: var(--text); font-size: 16px; cursor: pointer; transition: background 0.15s;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-left: 2px;
}
.hdr-gear:hover { background: rgba(255,255,255,0.12); }

/* ── SETTINGS SHEET ───────────────────────────────── */
.sheet-bg {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.sheet-bg.show { opacity: 1; pointer-events: auto; }
.sheet {
  width: 100%; max-width: 480px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  padding: 8px 16px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(100%); transition: transform 0.28s cubic-bezier(0.34,1.2,0.64,1);
  display: flex; flex-direction: column; gap: 8px;
}
.sheet-bg.show .sheet { transform: translateY(0); }
.sheet-grip { width: 40px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.2); margin: 8px auto 6px; }
.sheet-title { font-size: 14px; font-weight: 700; color: var(--muted); padding: 0 4px 4px; }
.sheet-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  width: 100%; padding: 14px; border-radius: var(--r-sm);
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.15s;
  text-align: left;
}
.sheet-item:hover { background: var(--card2); }
.sheet-arrow { color: var(--muted); font-size: 18px; }
.sw { width: 42px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.15); position: relative; transition: background 0.2s; flex-shrink: 0; }
.sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform 0.2s; }
.sw.on { background: var(--green); }
.sw.on::after { transform: translateX(18px); }
.sheet-note { font-size: 12px; color: var(--muted); padding: 2px 4px; min-height: 1px; }

/* ── MAPA MUSCULAR ────────────────────────────────── */
.muscle-slide {
  flex-direction: column; gap: 6px;
  padding: 8px 10px 10px;
  background: linear-gradient(135deg, #15151f 0%, #0d0d14 100%);
}
.muscle-svg { flex: 1; min-height: 0; width: 100%; display: block; }
.m-legend { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
.m-chip {
  font-size: 10px; font-weight: 700; line-height: 1;
  padding: 3px 7px; border-radius: 999px; white-space: nowrap;
}
.m-chip.prim { background: rgba(239,68,68,0.15); color: var(--accent); border: 1px solid rgba(239,68,68,0.35); }
.m-chip.sec  { background: rgba(249,115,22,0.12); color: var(--accent2); border: 1px solid rgba(249,115,22,0.3); }

/* ── NUTRIÇÃO ─────────────────────────────────────── */
.nutri-wrap { grid-column: 1/-1; max-width: 760px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.nplan-hdr { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
.nform { display: flex; flex-direction: column; gap: 10px; }
.nrow { display: flex; gap: 10px; flex-wrap: wrap; }
.nfield { flex: 1 1 120px; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.nfield.full { flex-basis: 100%; }
.nfield select, .nfield input, .nfree {
  height: 40px; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm);
  color: var(--text); font-size: 15px; font-weight: 600; padding: 0 10px; width: 100%;
}
.nfield select:focus, .nfield input:focus, .nfree:focus { outline: none; border-color: var(--accent); }
.nsec-title { font-size: 12px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 4px; }
.nchips { display: flex; flex-wrap: wrap; gap: 6px; }
.nchip { cursor: pointer; }
.nchip input { position: absolute; opacity: 0; pointer-events: none; }
.nchip span {
  display: inline-block; padding: 7px 12px; border-radius: 999px;
  background: var(--card); border: 1px solid var(--border);
  font-size: 13px; font-weight: 600; color: var(--muted); transition: background 0.15s, border-color 0.15s, color 0.15s;
}
.nchip input:checked + span { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.4); color: var(--accent); }
.nfree { height: 38px; font-size: 14px; }
.nbtn {
  margin-top: 8px; height: 48px; border-radius: var(--r-sm);
  background: linear-gradient(90deg, var(--accent), var(--accent2)); border: none;
  color: #fff; font-size: 16px; font-weight: 800; cursor: pointer;
}
.nbtn:active { transform: scale(0.99); }
.ntargets { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.ntar { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 10px; text-align: center; display: flex; flex-direction: column; gap: 3px; }
.ntar-v { font-size: 24px; font-weight: 800; color: var(--accent); }
.ntar-l { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.nmacros { font-size: 13px; color: var(--muted); text-align: center; }
.nmeals { display: flex; flex-direction: column; gap: 8px; }
.nmeal { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 11px 13px; }
.nmeal.treino { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.05); }
.nmeal-t { font-size: 13px; font-weight: 700; color: var(--text); }
.nmeal-i { font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.4; }
.nnote { font-size: 12px; color: var(--muted); line-height: 1.55; background: rgba(59,130,246,0.05); border: 1px solid rgba(59,130,246,0.12); border-radius: var(--r-sm); padding: 10px 12px; }
.nnote b { color: rgba(241,245,249,0.7); }
.nshop { display: flex; flex-wrap: wrap; gap: 6px; }
.nshop-i { font-size: 12px; font-weight: 600; color: var(--text); background: var(--card2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 6px 10px; }
.ndisc { font-size: 11px; color: var(--muted); font-style: italic; }

/* ═══════════════════════ STATE ══════════════════════ */
const STORE_KEY = "treino_v2";
let ST = { day:"Segunda", sets:{}, done:{}, log:{}, nutri:{profile:null}, profile:{}, measures:[], intake:[], media:{} };
try { const s=localStorage.getItem(STORE_KEY); if(s) ST={...ST,...JSON.parse(s)}; } catch(_){}
if(!ST.profile || typeof ST.profile!=='object') ST.profile={};
if(!Array.isArray(ST.measures)) ST.measures=[];
if(!Array.isArray(ST.intake)) ST.intake=[];
if(!ST.media || typeof ST.media!=='object') ST.media={};
/* migração: dados do corpo da nutrição antiga → Perfil + 1ª medida */
if(!ST.profile.height && ST.nutri && ST.nutri.profile && ST.nutri.profile.height){
  const o=ST.nutri.profile;
  ST.profile={ sex:o.sex, age:o.age, height:o.height, goal:o.goal, activity:o.activity };
  if(o.weight>0 && !ST.measures.length) ST.measures=[{ date:todayStr(), weight:o.weight }];
  ST.nutri={ profile:{ meals:o.meals, cookTime:o.cookTime, fav:o.fav, restrictions:o.restrictions, supps:o.supps, avoid:o.avoid } };
}

function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(ST)); } catch(_){} }
function key(day,i) { return `${day}:${i}`; }
function getSets(day,i) { return ST.sets[key(day,i)] || []; }

/* progressão de carga (kg × reps), agregada por nome de exercício */
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function nowISO(){ return new Date().toISOString(); }
function fmtTime(ts){ if(!ts) return ''; const d=new Date(ts); return isNaN(d.getTime())?'':d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }
function fmtDateTime(ts){ if(!ts) return ''; const d=new Date(ts); return isNaN(d.getTime())?'':d.toLocaleDateString('pt-PT')+' '+d.toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'}); }
function getLog(name){ return (ST.log && ST.log[name]) || []; }
function logSet(name,w,r){
  w=parseFloat(w); r=parseInt(r,10);
  if(!(w>0) || !(r>0)) return false;
  const arr=getLog(name).slice();
  const t=todayStr();
  const idx=arr.findIndex(e=>e.date===t);
  const entry={date:t,ts:nowISO(),w,r};
  if(idx>=0) arr[idx]=entry; else arr.push(entry);
  arr.sort((a,b)=> a.date<b.date?-1:(a.date>b.date?1:0));
  ST.log=Object.assign({}, ST.log, {[name]:arr});
  save();
  return true;
}
function est1RM(w,r){ return Math.round(w*(1+r/30)); }

function toggleSet(day,i,si) {
  const k=key(day,i), arr=getSets(day,i);
  const idx=arr.indexOf(si);
  if(idx>=0) arr.splice(idx,1); else arr.push(si);
  ST.sets[k]=arr;
  const ex=DAYS[day].ex[i];
  const total=typeof ex.s==='number'?ex.s:0;
  ST.done[k] = total>0 && arr.length>=total;
  save();
  refreshCard(day,i);
  refreshProgress();
  if(idx<0) timerStart(REST_SEC);
}

function markDone(day,i) {
  const k=key(day,i), ex=DAYS[day].ex[i];
  const total=typeof ex.s==='number'?ex.s:1;
  ST.sets[k]=Array.from({length:total},(_,j)=>j);
  ST.done[k]=true;
  save();
  refreshCard(day,i);
  refreshProgress();
}

function resetDay(day) {
  if(!confirm(`Resetar progresso de ${day}?`)) return;
  DAYS[day].ex.forEach((_,i)=>{ delete ST.sets[key(day,i)]; delete ST.done[key(day,i)]; });
  save(); render(day);
}

function getProgress(day) {
  const total=DAYS[day].ex.length;
  const done=DAYS[day].ex.filter((_,i)=>ST.done[key(day,i)]).length;
  return {total,done};
}

/* ═══════════════ CARGA / PROGRESSÃO (UI) ════════════ */
function saveLoad(i,name){
  const wEl=document.getElementById(`w-${i}`), rEl=document.getElementById(`r-${i}`);
  if(!wEl||!rEl) return;
  const btn=document.querySelector(`#load-${i} .load-save`);
  if(logSet(name, wEl.value, rEl.value)){
    if(btn){ btn.textContent='✓'; btn.classList.add('ok'); setTimeout(()=>{ btn.textContent='Registar'; btn.classList.remove('ok'); },900); }
    const lc=document.getElementById(`lc-${i}`);
    if(lc && !lc.hidden) lc.innerHTML=loadChart(name);
  } else if(btn){
    btn.textContent='kg × reps?'; setTimeout(()=>{ btn.textContent='Registar'; },1100);
  }
}

function toggleChart(i,name){
  const lc=document.getElementById(`lc-${i}`);
  if(!lc) return;
  if(lc.hidden){ lc.innerHTML=loadChart(name); lc.hidden=false; }
  else lc.hidden=true;
}

function chartSVG(vals){
  const W=280,H=92,P=10,n=vals.length;
  const min=Math.min(...vals),max=Math.max(...vals),span=(max-min)||1;
  const xAt=k=> n>1 ? P+k*(W-2*P)/(n-1) : W/2;
  const yAt=v=> H-P-(v-min)/span*(H-2*P);
  const pts=vals.map((v,k)=>[+xAt(k).toFixed(1),+yAt(v).toFixed(1)]);
  const line=pts.map((p,k)=>`${k?'L':'M'}${p[0]} ${p[1]}`).join(' ');
  const area=`M${pts[0][0]} ${H-P} `+pts.map(p=>`L${p[0]} ${p[1]}`).join(' ')+` L${pts[n-1][0]} ${H-P} Z`;
  const dots=pts.map((p,k)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${k===n-1?3.5:2.4}" fill="${k===n-1?'#f97316':'#ef4444'}"/>`).join('');
  return `<svg class="lc-svg" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444" stop-opacity="0.35"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#lcg)"/><path d="${line}" fill="none" stroke="#ef4444" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}</svg>`;
}
function loadChart(name){
  const data=getLog(name);
  if(!data.length) return '<div class="lc-empty">Sem registos. Regista a carga (kg × reps) para veres a evolução.</div>';
  const ws=data.map(e=>e.w), min=Math.min(...ws), max=Math.max(...ws), n=data.length, last=data[n-1];
  return chartSVG(ws)+`
    <div class="lc-meta">
      <span><b>${last.w}</b>kg × ${last.r}</span>

function exportBackup(){
  const payload={ app:'treino', v:2, exportedAt:new Date().toISOString(), rest_sec:REST_SEC, state:ST };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`treino-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importBackup(e){
  const file=e.target.files && e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const p=JSON.parse(reader.result);
      const incoming=(p && typeof p==='object' && p.state) ? p.state : p;
      if(!incoming || typeof incoming!=='object' || typeof incoming.sets!=='object' || typeof incoming.done!=='object')
        throw new Error('estrutura inválida');
      if(!confirm('Importar substitui o progresso atual. Continuar?')){ e.target.value=''; return; }
      ST={ day:'Segunda', sets:{}, done:{}, log:{}, nutri:{profile:null}, profile:{}, measures:[], intake:[], media:{}, ...incoming };
      if(!ST.log || typeof ST.log!=='object') ST.log={};
      if(!ST.nutri || typeof ST.nutri!=='object') ST.nutri={profile:null};
      if(!ST.profile || typeof ST.profile!=='object') ST.profile={};
      if(!Array.isArray(ST.measures)) ST.measures=[];
      if(!Array.isArray(ST.intake)) ST.intake=[];
      if(!ST.media || typeof ST.media!=='object') ST.media={};
      if(ST.day!=='__nutri' && ST.day!=='__perfil' && !DAYS[ST.day]) ST.day='Segunda';
      if(p && typeof p.rest_sec==='number'){ REST_SEC=Math.max(15,Math.min(300,Math.round(p.rest_sec))); localStorage.setItem('rest_sec',REST_SEC); }
      save();
      closeSheet();
      render(ST.day);
      document.getElementById('restLabel').textContent=REST_SEC+'s';
      alert('Backup importado ✓');
    }catch(err){
      alert('Não foi possível importar: '+(err && err.message ? err.message : 'ficheiro inválido'));
    }finally{
      e.target.value='';
    }
  };
  reader.onerror=()=>{ alert('Erro a ler o ficheiro.'); e.target.value=''; };
  reader.readAsText(file);
}

let wakeLock=null;
let wakeWanted = localStorage.getItem('wake_on')==='1';
async function acquireWake(){
  if(!wakeWanted || !('wakeLock' in navigator) || document.visibilityState!=='visible') return;
  try{ wakeLock = await navigator.wakeLock.request('screen'); }
  catch(_){ /* o browser pode rejeitar */ }
}
async function releaseWake(){ try{ if(wakeLock) await wakeLock.release(); }catch(_){} wakeLock=null; }
function toggleWake(){
  wakeWanted=!wakeWanted;
  localStorage.setItem('wake_on', wakeWanted?'1':'0');
  if(wakeWanted) acquireWake(); else releaseWake();
  syncWakeUI();
}
function syncWakeUI(){
  const sw=document.getElementById('wakeSw'); if(sw) sw.classList.toggle('on',wakeWanted);
  const note=document.getElementById('wakeNote');
  if(note) note.textContent = ('wakeLock' in navigator) ? '' : '⚠ O teu browser não suporta manter o ecrã ligado.';
}

let REST_SEC = parseInt(localStorage.getItem('rest_sec') || '60');
function adjustRest(d) {
  REST_SEC = Math.max(15, Math.min(300, REST_SEC + d));
  localStorage.setItem('rest_sec', REST_SEC);
  document.getElementById('restLabel').textContent = REST_SEC + 's';
  document.querySelectorAll('.rest-lbl').forEach(s => s.textContent = REST_SEC + 's');
}

const TM = { on:false, total:60, left:60, iv:null };
const CIRC = 2*Math.PI*22; // stroke-dasharray

function timerStart(sec) {
  if(TM.iv) clearInterval(TM.iv);
  TM.total=sec; TM.left=sec; TM.on=true;
  document.getElementById('timerBanner').classList.add('show');
  renderTimer();
  TM.iv=setInterval(()=>{
    TM.left--;
    if(TM.left<=0){ TM.left=0; clearInterval(TM.iv); TM.on=false;
      if(navigator.vibrate) navigator.vibrate([200,80,200,80,400]);
    }
    renderTimer();
  },1000);
}

function timerAdd(s) {
  TM.left+=s; TM.total=Math.max(TM.total,TM.left);
  if(!TM.on){ TM.on=true; timerStart(TM.left); return; }
  renderTimer();
}

function timerDismiss() {
  if(TM.iv) clearInterval(TM.iv);
  TM.on=false;
  document.getElementById('timerBanner').classList.remove('show','warn');
}

function renderTimer() {
  const {left,total}=TM;
  const m=Math.floor(left/60), s=String(left%60).padStart(2,'0');
  const label=`${m}:${s}`;
  const pct = total>0 ? left/total : 0;
  const offset = CIRC*(1-pct);

  document.getElementById('tNum').textContent=label;
  document.getElementById('tBig').textContent=label;
  document.getElementById('tRingFill').style.strokeDashoffset=offset;

  const banner=document.getElementById('timerBanner');
  if(left<=10 && TM.on) banner.classList.add('warn');
  else banner.classList.remove('warn');
}

const SL={};
function slInit(id,n){ SL[id]={cur:0,n}; }
function slTo(id,i){ SL[id].cur=((i%SL[id].n)+SL[id].n)%SL[id].n; slSync(id); }
function slNext(id){ slTo(id,SL[id].cur+1); }
function slPrev(id){ slTo(id,SL[id].cur-1); }
function slSync(id){
  const {cur,n}=SL[id];
  const slides=document.getElementById(`slides-${id}`);
  if(slides) slides.style.transform=`translateX(-${cur*100}%)`;
  document.querySelectorAll(`#dots-${id} .dot`).forEach((d,i)=>d.classList.toggle('on',i===cur));
  const ctr=document.getElementById(`ctr-${id}`);
  if(ctr) ctr.textContent=`${cur+1}/${n}`;
}

const PROT=['Frango','Peru','Carne vaca','Atum','Salmão','Ovos','Iogurte','Queijo fresco','Tofu','Whey'];
const CARB=['Arroz','Massa','Batata','Batata-doce','Pão','Aveia','Grão','Feijão','Fruta'];
const VEG=['Brócolos','Espinafres','Tomate','Alface','Cenoura','Courgette','Pimento','Feijão-verde'];
const SNACK=['Fruta','Frutos secos','Iogurte','Barra proteica','Queijo','Ovo cozido'];

let NUTRI_EDIT=false;

function calcTargets(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const af={sed:1.2,leve:1.375,mod:1.55,alto:1.725}[p.activity]||1.375;
  const tdee=bmr*af;
  const adj={perder:-0.18,manter:0,ganhar:0.12}[p.goal]||0;
  const kcal=Math.round((tdee*(1+adj))/10)*10;
  const ppk={perder:2.0,manter:1.8,ganhar:2.0}[p.goal]||1.8;
  const protein=Math.round(p.weight*ppk);
  const water=Math.round(p.weight*0.035*10)/10;
  const fatG=Math.round(p.weight*0.9);
  const carbG=Math.max(0,Math.round((kcal-protein*4-fatG*9)/4));
  return {kcal,protein,water,fatG,carbG};
}

function mealPlan(p){
  const fav=p.fav||{};
  const pick=(cat,fb,idx)=>{ const a=fav[cat]||[]; return a.length?a[((idx||0)%a.length)]:fb; };
  const hasWhey=(p.supps||[]).indexOf('Whey')>=0;
  const meals=[];
  meals.push({t:'Pequeno-almoço', i:`${pick('protein','Ovos',0)} + ${pick('carbs','Aveia',0)} + fruta`});
  meals.push({t:'Pré-treino · 60–90min antes', i:`${pick('carbs','Pão',1)} + ${pick('protein','Iogurte',1)} — hidratos para energia`, tag:'treino'});
  meals.push({t:'Pós-treino · até 1h depois', i:`${hasWhey?'Whey':pick('protein','Frango',2)} + ${pick('carbs','Arroz',2)} — repor + construir`, tag:'treino'});
  meals.push({t:'Almoço', i:`${pick('protein','Frango',3)} + ${pick('carbs','Arroz',3)} + ${pick('veg','Brócolos',0)}`});
  if((p.meals||4)>=5) meals.push({t:'Lanche', i:`${pick('snack','Fruta',0)} + ${pick('protein','Iogurte',4)}`});

function shopping(p){
  const f=p.fav||{};

function getProfile(){ return ST.profile||{}; }
function bodyMetrics(){ const p=getProfile(); return { sex:p.sex||'m', age:+p.age||0, height:+p.height||0, goal:p.goal||'manter', activity:p.activity||'mod', weight:latestWeight() }; }
function profileComplete(){ const b=bodyMetrics(); return b.age>0 && b.height>0 && b.weight>0; }
function latestMeasure(){ const m=ST.measures||[]; return m.length?m[m.length-1]:null; }
function latestWeight(){ const e=latestMeasure(); return e&&e.weight>0?e.weight:0; }

function bodyFat(e){
  const p=getProfile(), h=+p.height, waist=+e.waist, neck=+e.neck, hip=+e.hip;
  if(!(h>0)) return null;
  let v;
  if(p.sex==='f'){
    if(!(waist>0 && hip>0 && neck>0 && (waist+hip-neck)>0)) return null;
    v=495/(1.29579-0.35004*Math.log10(waist+hip-neck)+0.22100*Math.log10(h))-450;
  } else {
    if(!(waist>0 && neck>0 && (waist-neck)>0)) return null;
    v=495/(1.0324-0.19077*Math.log10(waist-neck)+0.15456*Math.log10(h))-450;
  }
  if(!isFinite(v) || v<=0 || v>70) return null;
  return Math.round(v*10)/10;
}

const METRIC_DEF={weight:['Peso','kg'],bf:['% Gordura','%'],waist:['Cintura','cm'],neck:['Pescoço','cm'],hip:['Anca','cm'],chest:['Peito','cm'],arm:['Braço','cm'],thigh:['Coxa','cm']};

}
function metricChartHTML(field){
  const s=measureSeries(field), def=METRIC_DEF[field]||[field,''];

  const vals=s.map(p=>p.v), last=vals[vals.length-1], first=vals[0], d=Math.round((last-first)*10)/10;
  return chartSVG(vals)+`<div class="lc-meta"><span><b>${last}</b>${def[1]} ${def[0]}</span><span class="lc-1rm">${d>0?'+':''}${d}${def[1]} desde início</span><span class="lc-range">${s.length} reg.</span></div>`;
}

function saveMeasure(){
  const num=id=>{ const el=document.getElementById(id); const x=el?parseFloat(el.value):NaN; return x>0?x:undefined; };
  const weight=num('m-weight');
  if(!(weight>0)){ alert('O peso é obrigatório para registar medidas.'); return; }
  const date=MEASURE_EDIT_DATE||todayStr();
  const entry={ date, ts:nowISO(), weight };
  ['waist','neck','hip','chest','arm','thigh'].forEach(f=>{ const x=num('m-'+f); if(x!==undefined) entry[f]=x; });
  const arr=(ST.measures||[]).slice();
  const idx=arr.findIndex(e=>e.date===date);
  if(idx>=0) arr[idx]=Object.assign({},arr[idx],entry); else arr.push(entry);
  arr.sort((a,b)=>a.date<b.date?-1:(a.date>b.date?1:0));
  ST.measures=arr;
  MEASURE_EDIT_DATE=null;
  save(); renderProfile();
}

function delMeasure(date){
  if(!confirm('Apagar este registo de medidas?')) return;
  ST.measures=(ST.measures||[]).filter(e=>e.date!==date);
  if(MEASURE_EDIT_DATE===date) MEASURE_EDIT_DATE=null;
  save(); renderProfile();
}
function measuresHistoryHTML(){
  const arr=(ST.measures||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  if(!arr.length) return '';
  return `<div class="nsec-title">Histórico de medidas</div><div class="ilist">`+arr.map(e=>{
    const bf=bodyFat(e), parts=[`${e.weight}kg`];
    if(bf!=null) parts.push(`${bf}% gord.`);
    ['waist','neck','hip','chest','arm','thigh'].forEach(f=>{ if(e[f]!=null) parts.push(`${METRIC_DEF[f][0]} ${e[f]}`); });
    return `<div class="iitem"><div class="iitem-main"><span class="iitem-n">${e.date}</span><span class="iitem-t">${e.ts?fmtTime(e.ts)+' · ':''}${parts.join(' · ')}</span></div><div class="iitem-r"><button class="iitem-x" onclick="editMeasure('${e.date}')" aria-label="Editar registo">✎</button><button class="iitem-x" onclick="delMeasure('${e.date}')" aria-label="Apagar registo">✕</button></div></div>`;
  }).join('')+`</div>`;
}

function macrosSummaryHTML(){
  const b=bodyMetrics();
  if(!(b.age>0 && b.height>0 && b.weight>0)) return `<div class="nsec-title">Macros &amp; metas</div><div class="ndisc">Preenche idade + altura e regista o peso para calcular as metas.</div>`;
  const t=calcTargets(b), goalTxt={perder:'perder gordura',manter:'manter',ganhar:'ganhar músculo'}[b.goal]||b.goal;
  return `<div class="nsec-title">Macros &amp; metas</div>
  <div class="ntargets">
    <div class="ntar"><span class="ntar-v">${t.kcal}</span><span class="ntar-l">kcal/dia</span></div>
    <div class="ntar"><span class="ntar-v">${t.protein}g</span><span class="ntar-l">proteína</span></div>
    <div class="ntar"><span class="ntar-v">${t.water}L</span><span class="ntar-l">água</span></div>
  </div>
  <div class="nmacros">Hidratos ~${t.carbG}g · Gordura ~${t.fatG}g · objetivo: ${goalTxt}</div>
  <div class="ndisc">As sugestões de refeições estão na tab 🥗 Nutrição.</div>`;
}
function renderProfile(content){
  content=content||document.getElementById('content');
  document.getElementById('hdrSub').textContent='Perfil';
  document.getElementById('progFill').style.width='0%';
  content.innerHTML=`<div class="nutri-wrap">${profileDataHTML()}${measuresHTML()}${macrosSummaryHTML()}</div>`;
}

/* ═══════════════════════ RENDER ═════════════════════ */
function refreshProgress() {
  const {total,done}=getProgress(ST.day);
  document.getElementById('progFill').style.width=`${total?done/total*100:0}%`;
  document.getElementById('hdrSub').textContent=`${DAYS[ST.day].label} · ${done}/${total}`;
  document.querySelectorAll('.tab').forEach(t=>{
    if(t.dataset.day===ST.day){
      const b=t.querySelector('.tab-badge');
      if(b){ const {done:d,total:tot}=getProgress(ST.day); b.textContent=d>0?`${d}/${tot}`:''; b.style.display=d>0?'':'none'; }
    }
  });
}

function refreshCard(day,i) {
  const card=document.getElementById(`card-${i}`);
  if(!card) return;
  const isDone=!!ST.done[key(day,i)];
  card.classList.toggle('done',isDone);
  const sets=getSets(day,i);
  card.querySelectorAll('.set-btn').forEach(btn=>{
    const si=+btn.dataset.si;
    btn.classList.toggle('on',sets.includes(si));
  });
}

function buildCard(day,ex,i) {
  const card=document.createElement('div');
  card.className='card'+(ST.done[key(day,i)]?' done':'');
  card.id=`card-${i}`;

  // slides: 1) demo real (CDN)  2) mapa muscular  3+) demos do utilizador  4+) diagramas (ex.dia)
  const mm=MUSCLES[ex.name];
  const dmo=DEMOS[ex.name];
  const media=(ST.media&&ST.media[ex.name])||[];
  const extra=ex.dia||[];
  const slidesArr=[];
  if(dmo) slidesArr.push(demoSlide(dmo,ex.name));
  slidesArr.push(mm ? muscleSlide(mm) : noImgSlide(ex.name));
  media.forEach((url,mi)=>slidesArr.push(mediaSlide(url,ex.name,mi)));
  extra.forEach(src=>slidesArr.push(`<div class="slide"><img src="${src}" alt="${ex.name}" loading="lazy"
        onerror="this.closest('.slide').innerHTML='<div class=\\'no-img\\'><span>💪</span><span>${ex.name}</span></div>'"></div>`));
  const n=slidesArr.length;
  slInit(i,n);
  const slidesHTML=slidesArr.join('');

  const dotsHTML = n>1
    ? `<div class="dots" id="dots-${i}">${Array.from({length:n},(_,j)=>`<div class="dot${j===0?' on':''}" onclick="slTo(${i},${j})"></div>`).join('')}</div>`
    : '';

  const navHTML = n>1
    ? `<button class="slide-prev" onclick="slPrev(${i})">‹</button>
       <button class="slide-next" onclick="slNext(${i})">›</button>`
    : '';

  const totalSets=typeof ex.s==='number'?ex.s:0;
  const completedSets=getSets(day,i);

  const setsHTML = totalSets>0
    ? `<div>
         <div class="sets-label">Séries</div>
         <div class="sets-row">
           ${Array.from({length:totalSets},(_,si)=>`
             <button class="set-btn${completedSets.includes(si)?' on':''}" data-si="${si}"
                     onclick="toggleSet('${day}',${i},${si});this.classList.add('pop');setTimeout(()=>this.classList.remove('pop'),220)">
               ${si+1}
             </button>`).join('')}
         </div>
       </div>`
    : '';

  const jsName=ex.name.replace(/'/g,"\\'");
  const lastLog=getLog(ex.name).slice(-1)[0];
  const loadHTML = totalSets>0 ? `
      <div class="load" id="load-${i}">
        <div class="load-row">
          <input class="load-in" id="w-${i}" type="number" inputmode="decimal" min="0" step="0.5" placeholder="kg" value="${lastLog?lastLog.w:''}" aria-label="Peso (kg)">
          <span class="load-x">×</span>
          <input class="load-in" id="r-${i}" type="number" inputmode="numeric" min="0" step="1" placeholder="reps" value="${lastLog?lastLog.r:''}" aria-label="Repetições">
          <button class="load-save" onclick="saveLoad(${i},'${jsName}')">Registar</button>
          <button class="load-chart-btn" onclick="toggleChart(${i},'${jsName}')" aria-label="Ver progresso">📈</button>
        </div>
        <div class="lc" id="lc-${i}" hidden></div>
      </div>` : '';

  card.innerHTML=`
    <div class="img-wrap">
      <div class="slides" id="slides-${i}">${slidesHTML}</div>
      ${navHTML}
      ${dotsHTML}
      <button class="add-media" onclick="addMedia('${jsName}')" aria-label="Adicionar demonstração">＋ demo</button>
    </div>
    <div class="card-body">
      <div class="card-title-row">
        <div class="card-title">${ex.name}</div>
        <div class="done-pill">✓ Feito</div>
      </div>
      <div class="card-stats">
        <div class="stat">
          <span class="stat-label">Séries</span>
          <span class="stat-val">${ex.s}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Reps</span>
          <span class="stat-val">${ex.r}</span>
        </div>
      </div>
      ${setsHTML}
      ${loadHTML}
      ${ex.tip?`<div class="tip">💡 ${ex.tip}</div>`:''}
      ${ex.alt?`<div class="card-alt"><strong>Alternativa:</strong> ${ex.alt}</div>`:''}
      <div class="card-actions">
        <button class="act-btn act-timer" onclick="timerStart(REST_SEC)">⏱ <span class="rest-lbl">${REST_SEC}s</span></button>
        <button class="act-btn act-done" onclick="markDone('${day}',${i})">
          ${ST.done[key(day,i)]?'✓ Concluído':'Marcar feito'}
        </button>
      </div>
    </div>
  `;

  // swipe
  const wrap=card.querySelector('.img-wrap');
  let x0=0,y0=0,swiping=false;
  wrap.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;swiping=false;},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    const dx=e.touches[0].clientX-x0,dy=e.touches[0].clientY-y0;
    if(!swiping && Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>6) swiping=true;
  },{passive:true});
  wrap.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-x0;
    if(swiping&&Math.abs(dx)>40){dx<0?slNext(i):slPrev(i);}
  });

  return card;
}

function render(day) {
  ST.day=day; save();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.day===day));

  const content=document.getElementById('content');
  if(day==='__nutri'){ renderNutri(content); return; }
  if(day==='__perfil'){ renderProfile(content); return; }
  content.innerHTML='';

  // day header
  const hdr=document.createElement('div');
  hdr.className='day-hdr';
  hdr.innerHTML=`
    <div class="day-hdr-text">
      <div class="day-hdr-name">${day}</div>
      <div class="day-hdr-sub">${DAYS[day].label}</div>
    </div>
    <button class="reset-btn" onclick="resetDay('${day}')">↺ Reset dia</button>
  `;
  content.appendChild(hdr);

  DAYS[day].ex.forEach((ex,i)=>content.appendChild(buildCard(day,ex,i)));
  refreshProgress();
}

// build tabs
const tabsEl=document.getElementById('tabs');
Object.keys(DAYS).forEach(day=>{
  const t=document.createElement('div');
  t.className='tab'+(day===ST.day?' active':'');
  t.dataset.day=day;
  const {done,total}=getProgress(day);
  t.innerHTML=`${day}<span class="tab-badge" style="display:${done>0?'':'none'}">${done>0?done+'/'+total:''}</span>`;
  t.onclick=()=>render(day);
  tabsEl.appendChild(t);
});

const perfilTab=document.createElement('div');
perfilTab.className='tab'+(ST.day==='__perfil'?' active':'');
perfilTab.dataset.day='__perfil';
perfilTab.innerHTML='👤 Perfil';
perfilTab.onclick=()=>render('__perfil');
tabsEl.appendChild(perfilTab);

const nutriTab=document.createElement('div');
nutriTab.className='tab'+(ST.day==='__nutri'?' active':'');
nutriTab.dataset.day='__nutri';
nutriTab.innerHTML='🥗 Nutrição';
nutriTab.onclick=()=>render('__nutri');
tabsEl.appendChild(nutriTab);

render(ST.day);
document.getElementById('restLabel').textContent = REST_SEC + 's';

/* ═══════════════ PWA + WAKE INIT ════════════════════ */
syncWakeUI();
acquireWake();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
</script>
